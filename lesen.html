<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TestDaF C1 — Modelltests Lesen (Digital)</title>
<style>
  :root{
    --teal-dark:#0f3d47; --teal:#155a68; --teal-light:#1d7285;
    --bg-page:#f4f8f9; --bg-instructions:#e7f1f3; --card-bg:#ffffff;
    --border:#cfe0e4; --text:#1e2d31; --text-soft:#516268;
    --correct:#1c7a4a; --wrong:#b3262c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg-page:#0e1416; --card-bg:#151d20; --border:#2b3a3f;
      --text:#eaf1f2; --text-soft:#9fb2b7; --bg-instructions:#132a2f;
    }
  }
  :root[data-theme="dark"]{
    --bg-page:#0e1416; --card-bg:#151d20; --border:#2b3a3f;
    --text:#eaf1f2; --text-soft:#9fb2b7; --bg-instructions:#132a2f;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-page);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;}
  .app{max-width:920px;margin:0 auto;min-height:100vh;background:var(--card-bg);box-shadow:0 0 24px rgba(0,0,0,.06);}
  header.topbar{background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;}
  header.topbar .brand{font-size:1.5rem;font-weight:700;letter-spacing:.5px;}
  header.topbar .subbrand{font-size:.72rem;opacity:.8;margin-top:2px;}
  header.topbar .tag{font-size:.8rem;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .select-screen{padding:36px 20px 60px;text-align:center;}
  .select-screen h2{color:var(--teal-dark);margin-bottom:6px;}
  .select-screen p{color:var(--text-soft);font-size:.92rem;max-width:560px;margin:0 auto 26px;}
  .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .sel-card{width:240px;border:1px solid var(--border);border-radius:14px;padding:20px 16px;background:var(--bg-instructions);cursor:pointer;text-align:left;}
  .sel-card:hover{border-color:var(--teal);}
  .sel-card .sc-title{font-size:1.05rem;font-weight:700;color:var(--teal-dark);margin-bottom:6px;}
  .sel-card .sc-desc{font-size:.8rem;color:var(--text-soft);}
  .select-note{font-size:.78rem;color:var(--text-soft);max-width:560px;margin:22px auto 0;}
  .taskbar{background:var(--bg-instructions);border-bottom:1px solid var(--border);padding:16px 20px 18px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .task-count{display:flex;align-items:baseline;gap:6px;min-width:70px;}
  .task-count .n{font-size:2.1rem;font-weight:800;color:var(--teal-dark);line-height:1;}
  .task-count .of{font-size:1rem;color:var(--text-soft);}
  .task-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);margin-bottom:2px;}
  .timer-wrap{display:flex;flex-direction:column;align-items:center;}
  .timer-circle{width:74px;height:74px;border-radius:50%;border:3px solid var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;color:var(--teal-dark);background:var(--card-bg);flex-shrink:0;}
  .timer-circle.warn{border-color:var(--wrong);color:var(--wrong);}
  .timer-caption{font-size:.65rem;color:var(--text-soft);margin-top:4px;}
  .instructions{flex:1;min-width:220px;}
  .instructions .title{font-weight:700;margin-bottom:4px;font-size:1rem;}
  .instructions p{margin:2px 0;font-size:.9rem;color:var(--text-soft);}
  .instructions .time-hint{font-weight:600;color:var(--teal-dark);}
  main{padding:22px 20px 100px;}
  h2.task-title{margin-top:0;font-size:1.2rem;color:var(--teal-dark);}
  .passage{font-size:0.95rem;text-align:justify;line-height:1.65;}
  .passage p{margin:0 0 16px;}
  select.gapselect{border:none;border-bottom:2px solid var(--teal);background:var(--bg-instructions);font:inherit;font-weight:600;color:var(--teal-dark);padding:3px 6px;border-radius:4px 4px 0 0;min-width:130px;}
  select.gapselect.answered{background:#dff0e4;border-color:var(--correct);}
  .order-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .order-item{border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:var(--bg-instructions);display:flex;gap:10px;align-items:flex-start;}
  .order-item .pos{font-weight:800;color:#fff;background:var(--teal);border-radius:50%;width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;}
  .order-item .txt{flex:1;font-size:.92rem;}
  .order-controls{display:flex;flex-direction:column;gap:4px;}
  .order-controls button{border:1px solid var(--border);background:var(--card-bg);color:var(--teal-dark);border-radius:5px;width:30px;height:26px;font-size:.85rem;cursor:pointer;}
  .order-controls button:disabled{opacity:.3;cursor:default;}
  .qblock{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .qblock:last-child{border-bottom:none;}
  .qtext{font-weight:600;margin-bottom:8px;font-size:0.95rem;}
  .opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.92rem;}
  .opt:hover{background:var(--bg-instructions);}
  .opt input{margin-top:3px;}
  .matchrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:10px;background:var(--bg-instructions);border-radius:8px;}
  .matchrow .ptxt{flex:1;min-width:200px;font-size:.9rem;}
  .matchrow select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--border);min-width:220px;}
  table.tzt{width:100%;border-collapse:collapse;margin-top:8px;font-size:.83rem;}
  table.tzt th, table.tzt td{border:1px solid var(--border);padding:8px 6px;text-align:center;}
  table.tzt th{background:var(--teal);color:#fff;font-weight:600;font-size:.76rem;}
  table.tzt td.label{text-align:left;font-weight:500;}
  table.tzt input[type=radio]{width:16px;height:16px;}
  .graphic-box{background:var(--bg-instructions);border:1px solid var(--border);border-radius:10px;padding:14px;margin:16px 0;}
  .graphic-box .cap{font-size:.76rem;color:var(--text-soft);margin-top:6px;text-align:center;}
  .summary-item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;font-size:.9rem;}
  .summary-item:hover{background:var(--bg-instructions);}
  .summary-item input{margin-top:4px;}
  .count-hint{font-size:.82rem;color:var(--text-soft);margin:10px 0;}
  footer.navbar{position:sticky;bottom:0;background:var(--card-bg);border-top:1px solid var(--border);padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;}
  footer .foot-note{font-size:.68rem;color:var(--text-soft);}
  .btn{border:none;border-radius:6px;padding:11px 18px;font-size:.88rem;font-weight:700;cursor:pointer;color:#fff;background:var(--teal-dark);}
  .btn.next{background:var(--teal);}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--teal-dark);border:1px solid var(--teal);}
  .results h2{color:var(--teal-dark);}
  .score-hero{background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;border-radius:12px;padding:24px;text-align:center;margin-bottom:22px;}
  .score-hero .pct{font-size:2.6rem;font-weight:800;}
  .score-hero .tdn{font-size:1rem;opacity:.9;margin-top:4px;}
  .result-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:.9rem;}
  .result-row .ok{color:var(--correct);font-weight:700;}
  .result-row .no{color:var(--wrong);font-weight:700;}
  .keylist{font-size:.82rem;color:var(--text-soft);margin-top:4px;}
  .a6-container { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
  .a6-statements { background: var(--bg-instructions); padding: 14px; border-radius: 8px; border: 1px solid var(--border); }
  .a6-statements-title { font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; }
  .a6-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size:0.88rem; }
  table.a6-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.a6-table th, table.a6-table td { border: 1px solid var(--border); padding: 10px; text-align: left; }
  table.a6-table th { background: var(--teal); color: #fff; width: 50%; }
  table.a6-table select { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid var(--border); font: inherit; }

  @media (max-width:480px){
    header.topbar{padding:14px 14px 12px;padding-top:calc(14px + env(safe-area-inset-top,0px));}
    .taskbar{padding:14px 14px;gap:12px;}
    main{padding:18px 14px 90px;}
    footer.navbar{padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));}
    .timer-circle{width:62px;height:62px;font-size:.92rem;}
    .cards{flex-direction:column;align-items:center;}
    table.tzt{font-size:.7rem;}
    .a6-list { grid-template-columns: 1fr; }
  }

  /* ===== Design-Update : lisibilité + cartes numérotées ===== */
  :root{--title:#0f3d47;}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--title:#7dd3fc;}
  }
  :root[data-theme="dark"]{--title:#7dd3fc;}
  .select-screen h2,.sel-card .sc-title,h2.task-title,
  .task-count .n,.timer-circle,.instructions .time-hint,
  .results h2,.btn.ghost,select.gapselect,
  .order-controls button{color:var(--title);}
  .app h3{color:var(--title)!important;}
  select.gapselect.answered{color:#0f3d47;}
  .select-screen{padding:44px 20px 70px;}
  .select-screen h2{font-size:clamp(1.5rem,5.5vw,2.1rem);line-height:1.25;letter-spacing:-.3px;margin:0 0 12px;}
  .select-screen p{line-height:1.7;}
  .cards{counter-reset:t;flex-direction:column;align-items:center;gap:14px;}
  .sel-card{position:relative;width:100%;max-width:440px;padding:20px 52px 20px 74px;border-radius:18px;transition:transform .2s,border-color .2s,box-shadow .2s;}
  .sel-card::before{counter-increment:t;content:counter(t);position:absolute;left:18px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal-light));color:#fff;font-weight:800;font-size:1.1rem;display:flex;align-items:center;justify-content:center;}
  .sel-card::after{content:"›";position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:1.9rem;color:var(--title);opacity:.6;}
  .sel-card:hover,.sel-card:active{transform:translateY(-3px);border-color:var(--teal-light);box-shadow:0 10px 24px rgba(0,0,0,.2);}

  /* ===== Fond flyer scientifique ===== */
  body{background:#050b12;}
  .app{position:relative;z-index:1;background:transparent;box-shadow:none;}
  .app::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(4,10,18,.30),rgba(4,10,18,.10) 45%,rgba(4,10,18,.35)),
      url("fond/fond-flyer.jpg") center top / cover no-repeat;
    background-color:#050b12;
  }
  main{background:var(--card-bg);background:color-mix(in srgb,var(--card-bg) 94%,transparent);}
  main:has(.select-screen){background:transparent;}
  .select-screen h2{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.75);}
  .select-screen p,.select-note{color:#e3eef2;text-shadow:0 1px 8px rgba(0,0,0,.75);}
  .sel-card{background:rgba(6,18,28,.72);border-color:rgba(125,211,252,.4);}
  .sel-card .sc-title{color:#7dd3fc;}
  .sel-card .sc-desc{color:#dbe9ee;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="brand">LESEN C1</div>
      <div class="subbrand">Digitaler TestDaF · Niveau C1 Niveauanforderung</div>
    </div>
    <div class="tag">Niveau C1</div>
  </header>
  <div class="taskbar" id="taskbar"></div>
  <main id="main"></main>
  <footer class="navbar" id="navbar"></footer>
</div>

<script>
const TEMPLATE = [
  {teil:1, type:'gap',     time:240,  label:'Lückentext ergänzen'},
  {teil:2, type:'order',   time:300,  label:'Textabschnitte ordnen'},
  {teil:3, type:'mc',      time:900,  label:'Multiple Choice (C1 Level)'},
  {teil:4, type:'match',   time:360,  label:'Textstellen zuordnen (C1 Level)'},
  {teil:5, type:'table',   time:540,  label:'Aussagen Kategorien zuordnen'},
  {teil:6, type:'twocat',  time:420,  label:'Vorteile / Nachteile Zuordnung (C1 Level)'},
  {teil:7, type:'summary', time:420,  label:'Fehler in Zusammenfassung erkennen'}
];
</script>
<!-- Les Modelltests : un fichier par test. Un fichier absent = test simplement non affiché. -->
<script src="tests/mt1.js"></script>
<script src="tests/mt2.js"></script>
<script src="tests/mt3.js"></script>
<script src="tests/mt4.js"></script>

<script>
const TESTS = [
  {id:1, title:'Modelltest C1 (Akademisch)', teile: typeof MT1!=='undefined' ? MT1 : null},
  {id:2, title:'Modelltest 2 (Digitaler TestDaF)', teile: typeof MT2!=='undefined' ? MT2 : null},
  {id:3, title:'Modelltest 3 (Digitaler TestDaF)', teile: typeof MT3!=='undefined' ? MT3 : null},
  {id:4, title:'Modelltest 4 (Digitaler TestDaF)', teile: typeof MT4!=='undefined' ? MT4 : null}
].filter(t=>t.teile);

let currentTestIdx = 0;
let current = 0;
let timerInterval = null;
let remaining = 0;
const answers = {};

function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+":"+s;
}
function clearTimer(){ if(timerInterval) clearInterval(timerInterval); }
function startTimer(seconds){
  clearTimer(); remaining = seconds; updateTimerDisplay();
  timerInterval = setInterval(()=>{
    remaining--;
    if(remaining <= 0){ remaining = 0; updateTimerDisplay(); clearTimer(); }
    else { updateTimerDisplay(); }
  },1000);
}
function updateTimerDisplay(){
  const el = document.getElementById('timerText');
  const circle = document.getElementById('timerCircle');
  if(!el) return;
  el.textContent = fmt(remaining);
  if(remaining <= 30){ circle.classList.add('warn'); } else { circle.classList.remove('warn'); }
}
function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function getBucket(test, task){
  if(!answers[test.id]) answers[test.id] = {};
  if(!answers[test.id][task.teil]) answers[test.id][task.teil] = {};
  return answers[test.id][task.teil];
}

function showTestSelect(){
  clearTimer();
  document.getElementById('taskbar').innerHTML = '';
  document.getElementById('navbar').innerHTML = '';
  let cards = '';
  TESTS.forEach((test, idx)=>{
    cards += `<div class="sel-card" data-idx="${idx}">
      <div class="sc-title">${test.title}</div>
      <div class="sc-desc">7 Aufgaben · Niveau C1 · Akribische Fachsprache</div>
    </div>`;
  });
  document.getElementById('main').innerHTML = `
    <div class="select-screen">
      <h2>Leseverstehen C1 — Modelltest wählen</h2>
      <p>Anspruchsvolle Texte, wissenschaftliches Vokabular und komplexe Satzstrukturen zur optimalen Vorbereitung auf den Digitalen TestDaF (TDN 4 / TDN 5).</p>
      <div class="cards">${cards}</div>
      <p class="select-note">Akademisches Übungsmaterial Niveau C1.</p>
    </div>
  `;
  document.querySelectorAll('.sel-card[data-idx]').forEach(card=>{
    card.onclick = ()=>{ currentTestIdx = parseInt(card.dataset.idx); current = 0; renderTask(); };
  });
}

function renderTaskbar(task, test){
  const tb = document.getElementById('taskbar');
  tb.innerHTML = `
    <div class="task-count">
      <div>
        <div class="task-label">${test.title} · Aufgabe</div>
        <span class="n">${task.teil}</span><span class="of">/${test.teile.length}</span>
      </div>
    </div>
    <div class="timer-wrap">
      <div class="timer-circle" id="timerCircle"><span id="timerText">--:--</span></div>
      <div class="timer-caption">verbleibend</div>
    </div>
    <div class="instructions">
      <div class="title">${task.label}</div>
      <p>${task.instructions}</p>
      <p class="time-hint">Sie haben ${fmt(task.time)} Minuten Zeit.</p>
    </div>
  `;
}
function renderNavbar(isLast, test){
  const nb = document.getElementById('navbar');
  nb.innerHTML = `
    <button class="btn ghost" id="btnMenu">Modelltests</button>
    <span class="foot-note">Niveau C1 · TestDaF Format</span>
    <button class="btn next" id="btnNext">${isLast ? 'Ergebnisse' : 'Aufgabe '+(current+2)+' →'}</button>
  `;
  document.getElementById('btnMenu').onclick = ()=>{
    if(confirm('Zurück zur Auswahlliste? Ihre Antworten bleiben gespeichert.')) showTestSelect();
  };
  document.getElementById('btnNext').onclick = ()=>{
    if(isLast){ showResults(); } else { current++; renderTask(); }
  };
}

function renderTask(){
  const test = TESTS[currentTestIdx];
  const task = test.teile[current];
  renderTaskbar(task, test);
  startTimer(task.time);
  const main = document.getElementById('main');
  main.innerHTML = `<h2 class="task-title">${task.title}</h2><div id="taskBody"></div>`;
  const body = document.getElementById('taskBody');
  switch(task.type){
    case 'gap': renderGap(task, test, body); break;
    case 'order': renderOrder(task, test, body); break;
    case 'mc': renderMC(task, test, body); break;
    case 'match': renderMatch(task, test, body); break;
    case 'table': renderTable(task, test, body); break;
    case 'twocat': renderTwoCat(task, test, body); break;
    case 'summary': renderSummary(task, test, body); break;
  }
  renderNavbar(current === test.teile.length-1, test);
  window.scrollTo({top:0, behavior:'instant'});
}

function renderGap(task, test, body){
  let html = '<div class="passage"><p>';
  task.segments.forEach((seg, i)=>{
    html += escapeHtml(seg);
    if(i < task.gaps.length){
      const gap = task.gaps[i];
      html += `<select class="gapselect" data-idx="${i}"><option value="">(${i+1}) wählen …</option>`;
      gap.options.forEach((opt, oi)=>{ html += `<option value="${oi}">${String.fromCharCode(97+oi)}) ${escapeHtml(opt)}</option>`; });
      html += `</select>`;
    }
  });
  html += '</p></div>';
  body.innerHTML = html;
  const a = getBucket(test, task);
  body.querySelectorAll('.gapselect').forEach(sel=>{
    const idx = sel.dataset.idx;
    if(a[idx] !== undefined){ sel.value = a[idx]; sel.classList.add('answered'); }
    sel.addEventListener('change', ()=>{ a[idx] = sel.value; sel.classList.toggle('answered', sel.value !== ''); });
  });
}

function renderOrder(task, test, body){
  const a = getBucket(test, task);
  if(!a.order) a.order = [...task.shuffledStart];
  const order = a.order;
  function draw(){
    let html = '<ul class="order-list">';
    order.forEach((origIdx, pos)=>{
      html += `<li class="order-item"><div class="pos">${pos+1}</div><div class="txt">${escapeHtml(task.items[origIdx])}</div>
        <div class="order-controls">
          <button data-dir="up" data-pos="${pos}" ${pos===0?'disabled':''}>▲</button>
          <button data-dir="down" data-pos="${pos}" ${pos===order.length-1?'disabled':''}>▼</button>
        </div></li>`;
    });
    html += '</ul>';
    body.innerHTML = html;
    body.querySelectorAll('button[data-dir]').forEach(btn=>{
      btn.onclick = ()=>{
        const pos = parseInt(btn.dataset.pos);
        const swapWith = btn.dataset.dir === 'up' ? pos-1 : pos+1;
        [order[pos], order[swapWith]] = [order[swapWith], order[pos]];
        draw();
      };
    });
  }
  draw();
}

function renderMC(task, test, body){
  let html = '<div class="passage">';
  task.passage.forEach(p=> html += `<p>${escapeHtml(p)}</p>`);
  html += '</div><div style="margin-top:20px;">';
  const a = getBucket(test, task);
  task.questions.forEach((q, qi)=>{
    html += `<div class="qblock"><div class="qtext">Frage ${qi+1}: ${escapeHtml(q.q)}</div>`;
    q.options.forEach((opt, oi)=>{
      const checked = a[qi] == oi ? 'checked' : '';
      html += `<label class="opt"><input type="radio" name="q${qi}" value="${oi}" ${checked}> ${String.fromCharCode(97+oi)}) ${escapeHtml(opt)}</label>`;
    });
    html += `</div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  task.questions.forEach((q, qi)=>{
    body.querySelectorAll(`input[name="q${qi}"]`).forEach(inp=> inp.addEventListener('change', ()=> a[qi] = inp.value));
  });
}

function renderMatch(task, test, body){
  let html = `<div class="passage"><p>${task.passageText}</p></div>`;
  html += `<h3 style="margin-top:20px;">Aussagen</h3><ul style="list-style:none;padding:0;">`;
  task.options.forEach((opt, oi)=>{
    html += `<li style="margin-bottom:6px;font-size:0.9rem;"><strong>${String.fromCharCode(97+oi)}</strong> ${escapeHtml(opt)}</li>`;
  });
  html += `</ul><div style="margin-top:20px;">`;
  
  const a = getBucket(test, task);
  task.textStellen.forEach((ts, ti)=>{
    html += `<div class="matchrow"><div class="ptxt"><strong>Textstelle [${ts}]:</strong></div>
      <select data-ti="${ti}"><option value="">Aussage wählen …</option>
      ${task.options.map((o,oi)=>`<option value="${oi}">Aussage ${String.fromCharCode(97+oi)}</option>`).join('')}
      </select></div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  
  body.querySelectorAll('select[data-ti]').forEach(sel=>{
    const ti = sel.dataset.ti;
    if(a[ti] !== undefined) sel.value = a[ti];
    sel.addEventListener('change', ()=> a[ti] = sel.value);
  });
}

function renderTable(task, test, body){
  let html = `<div class="passage"><p>${escapeHtml(task.passage)}</p></div>`;
  html += `<table class="tzt"><thead><tr><th style="text-align:left;">Aussagen</th>${task.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  const a = getBucket(test, task);
  task.items.forEach((item, ii)=>{
    html += `<tr><td class="label">${ii+1}. ${escapeHtml(item.text)}</td>`;
    task.columns.forEach((c, ci)=>{
      const checked = a[ii] == ci ? 'checked' : '';
      html += `<td><input type="radio" name="tbl${ii}" value="${ci}" ${checked}></td>`;
    });
    html += `</tr>`;
  });
  html += '</tbody></table>';
  body.innerHTML = html;
  task.items.forEach((item, ii)=>{
    body.querySelectorAll(`input[name="tbl${ii}"]`).forEach(inp=> inp.addEventListener('change', ()=> a[ii] = inp.value));
  });
}

function renderTwoCat(task, test, body){
  let html = `<div class="passage"><p>${escapeHtml(task.passage)}</p></div>`;
  html += `<div class="a6-container"><div class="a6-statements"><div class="a6-statements-title">Aussagen</div><div class="a6-list">`;
  task.aussagen.forEach(item => {
    html += `<div>${escapeHtml(item.text)}</div>`;
  });
  html += `</div></div>`;
  
  const a = getBucket(test, task);
  
  const makeSelect = (id) => {
    let s = `<select data-key="${id}"><option value="">-- Wählen --</option>`;
    task.aussagen.forEach(item => {
      const selected = a[id] === item.key ? 'selected' : '';
      s += `<option value="${item.key}" ${selected}>${item.text}</option>`;
    });
    s += `</select>`;
    return s;
  };

  html += `<table class="a6-table">
    <thead>
      <tr><th>Vorteile</th><th>Nachteile</th></tr>
    </thead>
    <tbody>
      <tr><td>1. ${makeSelect('v1')}</td><td>3. ${makeSelect('n3')}</td></tr>
      <tr><td>2. ${makeSelect('v2')}</td><td>4. ${makeSelect('n4')}</td></tr>
    </tbody>
  </table></div>`;

  body.innerHTML = html;
  body.querySelectorAll('select[data-key]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      a[sel.dataset.key] = sel.value;
    });
  });
}

function renderSummary(task, test, body){
  const maxVal = Math.max(...task.graphicData.map(d=>d.val));
  let bars = '';
  task.graphicData.forEach(d=>{
    const h = Math.round((d.val/maxVal)*90)+10;
    bars += `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;">
      <div style="font-size:.68rem;color:var(--text-soft);">${d.val}</div>
      <div style="width:70%;height:${h}px;background:var(--teal);border-radius:4px 4px 0 0;"></div>
      <div style="font-size:.7rem;color:var(--text-soft);">${d.year}</div></div>`;
  });
  const wrongCount = task.sentences.filter(s=>s.wrong).length;
  let html = `<div class="passage"><p>${escapeHtml(task.passage)}</p></div>
  <div class="graphic-box"><div style="display:flex;align-items:flex-end;gap:6px;height:120px;">${bars}</div>
  <div class="cap">${escapeHtml(task.graphicCaption)}</div></div>
  <h3 style="color:var(--teal-dark);font-size:1rem;">Zusammenfassung</h3>
  <div class="count-hint">Kreuzen Sie genau <strong>${wrongCount}</strong> Sätze an, die inhaltlich falsche Informationen enthalten. Ausgewählt: <span id="cnt">0</span>/${wrongCount}</div>
  <div id="sentList">`;
  const a = getBucket(test, task);
  task.sentences.forEach((s, si)=>{
    const checked = a[si] ? 'checked' : '';
    html += `<label class="summary-item"><input type="checkbox" data-si="${si}" ${checked}><span>${escapeHtml(s.text)}</span></label>`;
  });
  html += '</div>';
  body.innerHTML = html;
  function updateCount(){
    const n = task.sentences.filter((s,si)=>a[si]).length;
    document.getElementById('cnt').textContent = n;
  }
  body.querySelectorAll('input[data-si]').forEach(cb=>{
    cb.addEventListener('change', ()=>{ a[cb.dataset.si] = cb.checked; updateCount(); });
  });
  updateCount();
}

function scoreTask(task, test){
  const a = getBucket(test, task);
  let correct = 0, total = 0;
  switch(task.type){
    case 'gap':
      total = task.gaps.length;
      task.gaps.forEach((g,i)=>{ if(parseInt(a[i]) === g.correct) correct++; });
      break;
    case 'order':
      total = task.correctOrder.length;
      (a.order||[]).forEach((origIdx, pos)=>{ if(task.correctOrder[pos] === origIdx) correct++; });
      break;
    case 'mc':
      total = task.questions.length;
      task.questions.forEach((q,i)=>{ if(parseInt(a[i]) === q.correct) correct++; });
      break;
    case 'match':
      total = task.correct.length;
      task.correct.forEach((c,i)=>{ if(parseInt(a[i]) === c) correct++; });
      break;
    case 'table':
      total = task.items.length;
      task.items.forEach((item,i)=>{ if(parseInt(a[i]) === item.correct) correct++; });
      break;
    case 'twocat':
      total = 4;
      if(a.v1 === task.correctMap.v1) correct++;
      if(a.v2 === task.correctMap.v2) correct++;
      if(a.n3 === task.correctMap.n3) correct++;
      if(a.n4 === task.correctMap.n4) correct++;
      break;
    case 'summary':
      total = task.sentences.filter(s=>s.wrong).length;
      task.sentences.forEach((s,i)=>{ if(s.wrong && a[i]) correct++; });
      break;
  }
  return {correct, total};
}

function showResults(){
  clearTimer();
  document.getElementById('taskbar').innerHTML = '';
  const test = TESTS[currentTestIdx];
  const nb = document.getElementById('navbar');
  nb.innerHTML = `<button class="btn ghost" id="btnMenu2">Modelltests</button><span class="foot-note">Niveau C1 Auswertung</span><button class="btn" id="btnRestart">Neu starten</button>`;
  document.getElementById('btnRestart').onclick = ()=>{ answers[test.id] = {}; current = 0; renderTask(); };
  document.getElementById('btnMenu2').onclick = ()=> showTestSelect();

  let sumCorrect = 0, sumTotal = 0;
  let rows = '';
  test.teile.forEach(task=>{
    const {correct, total} = scoreTask(task, test);
    sumCorrect += correct; sumTotal += total;
    rows += `<div class="result-row"><span>Aufgabe ${task.teil} — ${task.label}</span><span class="${correct===total?'ok':'no'}">${correct} / ${total}</span></div>`;
  });
  const pct = sumTotal ? Math.round((sumCorrect/sumTotal)*100) : 0;
  let tdn = 'unterhalb TDN 3';
  if(pct >= 88) tdn = 'TDN 5 (Sehr gut / C1.2)'; else if(pct >= 67) tdn = 'TDN 4 (Gut / C1.1)'; else if(pct >= 44) tdn = 'TDN 3 (B2)';

  document.getElementById('main').innerHTML = `
    <div class="results">
      <div class="score-hero"><div class="pct">${pct}%</div><div>${sumCorrect} von ${sumTotal} Punkten</div><div class="tdn">Einstufung: ${tdn}</div></div>
      <h2>Ergebnisse — ${test.title}</h2>
      ${rows}
      <p class="keylist" style="margin-top:16px;">Systematische C1-Bewertung im digitalen TestDaF-Standard.</p>
    </div>
  `;
}
