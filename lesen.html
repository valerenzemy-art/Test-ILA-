            justify-content: space-between;

            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);

        .logo {

            font-weight: 700;

            padding: 0 20px;

            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;

        .select-screen p {
            text-align: center;
            color: var(--text-soft);
            margin-bottom: 40px;
            font-size: 0.95rem;
        }

        .cards {
            display: grid;

            gap: 20px;
        }

            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .sel-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            background: linear-gradient(145deg, #141414, #111827);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .sel-card .sc-desc {
            font-size: 0.85rem;
            color: var(--text-soft);
        }

        .taskbar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;

            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 30px;
        }

        .task-count {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .task-count .n {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .task-count .of {
            font-size: 0.9rem;
            color: var(--text-soft);
        }

            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: auto;
        }

        .timer-circle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.95srem;
            color: var(--accent);
            background: var(--bg-page);
        }

        .timer-circle.warn {
            border-color: var(--wrong);
            color: var(--wrong);
        }

        .timer-caption {
            font-size: 0.7rem;
            color: var(--text-soft);
            margin-top: 4px;
        }

        .instructions {
            flex: 1;
            min-width: 250px;
        }

        .instructions .title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .instructions p {
            font-size: 0.85rem;
            color: var(--text-soft);
            line-height: 1.5;
        }

            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
        }

        .passage {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 25px;
            font-size: 0.95rem;
            line-height: 1.8;
            margin-bottom: 25px;
            color: #d1d5db;
        }

        .passage p {
            margin-bottom: 15px;
        }

        .passage p:last-child {
            margin-bottom: 0;
        }

        select.gapselect {
            border: none;
            border-bottom: 2px solid var(--accent);
            background: var(--card-bg);
            font: inherit;
            font-weight: 600;
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            outline: none;
            margin: 0 4px;
        }

        select.gapselect.answered {
            background: rgba(34, 197, 94, 0.1);
            border-color: var(--correct);
            color: #4ade80;
        }

            display: flex;
            flex-direction: column;
            gap: 12px;

            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            background: var(--card-bg);
            display: flex;
            gap: 15px;
            align-items: center;

            justify-content: center;
            font-size: 0.85rem;

            border: 1px solid var(--border);

            width: 28px;

            background: var(--bg-page);
            color: var(--text);

            gap: 12px;
            align-items: flex-start;
            padding: 12px 15px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;

        }

        .summary-item:hover {
            border-color: var(--accent);
        }

        .summary-item input {
            margin-top: 3px;
            accent-color: var(--accent);
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);

            border-radius: 8px;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;

            color: #050505;

        .btn.next:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);

        .btn.ghost {
            background: transparent;
            color: var(--text-soft);
            border: 1px solid var(--border);

            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;

            font-weight: 700;
            color: var(--accent);

            padding: 25px;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-soft);
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>

const TESTS = [
  {id:1, title:'Modelltest 1 (Akademisch)', teile: MT1}
];

let currentTestIdx = 0;
let current = 0;
let timerInterval = null;
let remaining = 0;
const answers = {};

function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+":"+s;
}

function clearTimer(){ if(timerInterval) clearInterval(timerInterval); }

function startTimer(seconds){
  clearTimer(); remaining = seconds; updateTimerDisplay();
  timerInterval = setInterval(()=>{
    remaining--;
    if(remaining <= 0){ remaining = 0; updateTimerDisplay(); clearTimer(); }
    else { updateTimerDisplay(); }
  },1000);
}

function updateTimerDisplay(){
  const el = document.getElementById('timerText');
  const circle = document.getElementById('timerCircle');
  if(!el) return;
  el.textContent = fmt(remaining);
  if(remaining <= 30){ circle.classList.add('warn'); } else { circle.classList.remove('warn'); }
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getBucket(test, task){
  if(!answers[test.id]) answers[test.id] = {};
  if(!answers[test.id][task.teil]) answers[test.id][task.teil] = {};
  return answers[test.id][task.teil];
}

function showTestSelect(){
  clearTimer();
  let cards = '';
  TESTS.forEach((test, idx)=>{
    cards += `<div class="sel-card" data-idx="${idx}">
      <div class="sc-title">${test.title}</div>
      <div class="sc-desc"><i class="fa-solid fa-layer-group" style="color:var(--accent);"></i> 7 Aufgaben · Niveau C1</div>
    </div>`;
  });
  document.getElementById('appContainer').innerHTML = `
    <div class="select-screen">
      <h2><i class="fa-solid fa-microscope" style="color: var(--accent); margin-right: 10px;"></i> Leseverstehen — <span>Modelltest wählen</span></h2>
      <p>Anspruchsvolle Texte, wissenschaftliches Vokabular und komplexe Satzstrukturen zur optimalen Vorbereitung auf den Digitalen TestDaF.</p>
      <div class="cards">${cards}</div>
    </div>
  `;
  document.querySelectorAll('.sel-card[data-idx]').forEach(card=>{
    card.onclick = ()=>{ currentTestIdx = parseInt(card.dataset.idx); current = 0; renderTask(); };
  });
}

function renderTaskbar(task, test){
  return `
    <div class="taskbar">
      <div class="task-count">
        <span class="n">${task.teil}</span><span class="of">/${test.teile.length}</span>
      </div>
      <div class="instructions">
        <div class="title">${task.label}</div>
        <p>${task.instructions}</p>
      </div>
      <div class="timer-wrap">
        <div class="timer-circle" id="timerCircle"><span id="timerText">--:--</span></div>
        <div class="timer-caption">verbleibend</div>
      </div>
    </div>
  `;
}

function renderNavbar(isLast){
  return `
    <div class="navbar">
      <button class="btn ghost" onclick="showTestSelect()"><i class="fa-solid fa-arrow-left"></i> Übersicht</button>
      <button class="btn next" id="btnNext">${isLast ? 'Ergebnisse anzeigen <i class="fa-solid fa-check"></i>' : 'Nächste Aufgabe <i class="fa-solid fa-arrow-right"></i>'}</button>
    </div>
  `;
}

function renderTask(){
  const test = TESTS[currentTestIdx];
  const task = test.teile[current];
  startTimer(task.time);
  
  let html = renderTaskbar(task, test);
  html += `<h2 class="task-title">${task.title}</h2><div id="taskBody"></div>`;
  html += renderNavbar(current === test.teile.length-1);
  
  document.getElementById('appContainer').innerHTML = html;
  const body = document.getElementById('taskBody');
  
  switch(task.type){
    case 'gap': renderGap(task, test, body); break;
    case 'order': renderOrder(task, test, body); break;
    case 'mc': renderMC(task, test, body); break;
    case 'match': renderMatch(task, test, body); break;
    case 'table': renderTable(task, test, body); break;
    case 'twocat': renderTwoCat(task, test, body); break;
    case 'summary': renderSummary(task, test, body); break;
  }
  
  document.getElementById('btnNext').onclick = ()=>{
    if(current === test.teile.length-1){ showResults(); } else { current++; renderTask(); }
  };
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderGap(task, test, body){
  let html = '<div class="passage"><p>';
  task.segments.forEach((seg, i)=>{
    html += escapeHtml(seg);
    if(i < task.gaps.length){
      const gap = task.gaps[i];
      html += `<select class="gapselect" data-idx="${i}"><option value="">(${i+1}) wählen …</option>`;
      gap.options.forEach((opt, oi)=>{ html += `<option value="${oi}">${String.fromCharCode(97+oi)}) ${escapeHtml(opt)}</option>`; });
      html += `</select>`;
    }
  });
  html += '</p></div>';
  body.innerHTML = html;
  const a = getBucket(test, task);
  body.querySelectorAll('.gapselect').forEach(sel=>{
    const idx = sel.dataset.idx;
    if(a[idx] !== undefined){ sel.value = a[idx]; sel.classList.add('answered'); }
    sel.addEventListener('change', ()=>{ a[idx] = sel.value; sel.classList.toggle('answered', sel.value !== ''); });
  });
}

function renderOrder(task, test, body){
  const a = getBucket(test, task);
  if(!a.order) a.order = [...task.shuffledStart];
  const order = a.order;
  function draw(){
    let html = '<ul class="order-list">';
    order.forEach((origIdx, pos)=>{
      html += `<li class="order-item"><div class="pos">${pos+1}</div><div class="txt">${escapeHtml(task.items[origIdx])}</div>
        <div class="order-controls">
          <button data-dir="up" data-pos="${pos}" ${pos===0?'disabled':''}><i class="fa-solid fa-chevron-up"></i></button>
          <button data-dir="down" data-pos="${pos}" ${pos===order.length-1?'disabled':''}><i class="fa-solid fa-chevron-down"></i></button>
        </div></li>`;
    });
    html += '</ul>';
    body.innerHTML = html;
    body.querySelectorAll('button[data-dir]').forEach(btn=>{
      btn.onclick = ()=>{
        const pos = parseInt(btn.dataset.pos);
        const swapWith = btn.dataset.dir === 'up' ? pos-1 : pos+1;
        [order[pos], order[swapWith]] = [order[swapWith], order[pos]];
        draw();
      };
    });
  }
  draw();
}

function renderMC(task, test, body){
  let html = '<div class="passage">';
  task.passage.forEach(p=> html += `<p>${escapeHtml(p)}</p>`);
  html += '</div><div>';
  const a = getBucket(test, task);
  task.questions.forEach((q, qi)=>{
    html += `<div class="qblock"><div class="qtext">Frage ${qi+1}: ${escapeHtml(q.q)}</div>`;
    q.options.forEach((opt, oi)=>{
      const checked = a[qi] == oi ? 'checked' : '';
      html += `<label class="opt"><input type="radio" name="q${qi}" value="${oi}" ${checked}> <span>${String.fromCharCode(97+oi)}) ${escapeHtml(opt)}</span></label>`;
    });
    html += `</div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  task.questions.forEach((q, qi)=>{
    body.querySelectorAll(`input[name="q${qi}"]`).forEach(inp=>{
      inp.onchange = ()=>{ a[qi] = inp.value; };
    });
  });
}

function renderMatch(task, test, body){
  let html = '<div class="passage"><p>' + task.passageText + '</p></div><div style="margin-top:20px;">';
  const a = getBucket(test, task);
  task.textStellen.forEach((ts, idx)=>{
    html += `<div class="matchrow"><div class="ptxt">Textstelle [<strong>${ts}</strong>]</div>
      <select data-idx="${idx}"><option value="">Bitte zuordnen...</option>`;
    task.options.forEach((opt, oi)=>{
      html += `<option value="${oi}">${escapeHtml(opt)}</option>`;
    });
    html += `</select></div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  body.querySelectorAll('select').forEach(sel=>{
    const idx = sel.dataset.idx;
    if(a[idx] !== undefined) sel.value = a[idx];
    sel.onchange = ()=>{ a[idx] = sel.value; };
  });
}

function renderTable(task, test, body){
  let html = '<div class="passage"><p>' + escapeHtml(task.passage) + '</p></div><table class="tzt"><tr><th>Aussage</th>';
  task.columns.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
  html += '</tr>';
  const a = getBucket(test, task);
  task.items.forEach((item, ii)=>{
    html += `<tr><td class="label">${escapeHtml(item.text)}</td>`;
    task.columns.forEach((c, ci)=>{
      const checked = a[ii] == ci ? 'checked' : '';
      html += `<td><input type="radio" name="titem${ii}" value="${ci}" ${checked}></td>`;
    });
    html += `</tr>`;
  });
  html += '</table>';
  body.innerHTML = html;
  task.items.forEach((item, ii)=>{
    body.querySelectorAll(`input[name="titem${ii}"]`).forEach(inp=>{
      inp.onchange = ()=>{ a[ii] = inp.value; };
    });
  });
}

function renderTwoCat(task, test, body){
  let html = '<div class="passage"><p>' + escapeHtml(task.passage) + '</p></div><div style="margin-top:20px;">';
  const a = getBucket(test, task);
  ['v1','v2','n3','n4'].forEach((k, idx)=>{
    html += `<div class="matchrow"><div class="ptxt">Auswahl ${idx+1}</div><select data-key="${k}"><option value="">Wählen...</option>`;
    task.aussagen.forEach(opt=>{
      html += `<option value="${opt.key}">${escapeHtml(opt.text)}</option>`;
    });
    html += `</select></div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  body.querySelectorAll('select').forEach(sel=>{
    const key = sel.dataset.key;
    if(a[key] !== undefined) sel.value = a[key];
    sel.onchange = ()=>{ a[key] = sel.value; };
  });
}

function renderSummary(task, test, body){
  let html = '<div class="passage"><p>' + escapeHtml(task.passage) + '</p></div><div style="margin-top:15px;font-weight:600;margin-bottom:10px;">Wählen Sie die falschen Sätze aus:</div><div>';
  const a = getBucket(test, task);
  task.sentences.forEach((s, si)=>{
    const checked = a[si] ? 'checked' : '';
    html += `<label class="summary-item"><input type="checkbox" data-si="${si}" ${checked}> <span>${escapeHtml(s.text)}</span></label>`;
  });
  html += '</div>';
  body.innerHTML = html;
  body.querySelectorAll('input[type="checkbox"]').forEach(box=>{
    box.onchange = ()=>{ a[box.dataset.si] = box.checked; };
  });
}

function showResults(){
  clearTimer();
  document.getElementById('appContainer').innerHTML = `
    <div class="score-hero">
      <div class="pct"><i class="fa-solid fa-circle-check"></i> Modelltest beendet</div>
      <p style="color:var(--text-soft); margin-bottom: 25px;">Ihre Antworten wurden erfolgreich erfasst. Viel Erfolg beim Digitalen TestDaF!</p>
      <button class="btn next" onclick="showTestSelect()">Zurück zur Übersicht</button>
    </div>
  `;
}

window.onload = showTestSelect;
</script>
