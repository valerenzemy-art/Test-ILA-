<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TestDaF C1 — Modelltests Hören (Digital)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="brand">HÖREN C1</div>
      <div class="subbrand">Digitaler TestDaF · Hörverstehen Niveau C1</div>
    </div>
    <div class="tag">Niveau C1</div>
  </header>
  <div class="taskbar" id="taskbar"></div>
  <main id="main"></main>
  <footer class="navbar" id="navbar"></footer>
</div>

<!-- Importation du fichier de données externe -->
<script src="hoeren-data.js"></script>

<script>
let currentTestIdx = 0;
let current = 0;
const hoerenAnswers = {};

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getBucket(test, task){
  if(!hoerenAnswers[test.id]) hoerenAnswers[test.id] = {};
  if(!hoerenAnswers[test.id][task.teil]) hoerenAnswers[test.id][task.teil] = {};
  return hoerenAnswers[test.id][task.teil];
}

function showTestSelect(){
  document.getElementById('taskbar').innerHTML = '';
  document.getElementById('navbar').innerHTML = '';
  let cards = '';
  HOREN_TESTS.forEach((test, idx)=>{
    cards += `<div class="sel-card" data-idx="${idx}">
      <div class="sc-title">${test.title}</div>
      <div class="sc-desc">7 Hörverstehen-Aufgaben · Niveau C1 · TestDaF Format</div>
    </div>`;
  });
  document.getElementById('main').innerHTML = `
    <div class="select-screen">
      <h2>Hörverstehen C1 — Modelltest wählen</h2>
      <p>Audio- und Videodateien zur optimalen Vorbereitung auf den Digitalen TestDaF (Hören).</p>
      <div class="cards">${cards}</div>
    </div>
  `;
  document.querySelectorAll('.sel-card[data-idx]').forEach(card=>{
    card.onclick = ()=>{ currentTestIdx = parseInt(card.dataset.idx); current = 0; renderTask(); };
  });
}

function renderTaskbar(task, test){
  const tb = document.getElementById('taskbar');
  tb.innerHTML = `
    <div class="task-count">
      <div>
        <div class="task-label">${test.title} · Aufgabe</div>
        <span class="n">${task.teil}</span><span class="of">/${test.teile.length}</span>
      </div>
    </div>
    <div class="instructions" style="flex: 1; margin-left: 20px;">
      <div class="title">${task.label}</div>
      <p>${task.instructions}</p>
    </div>
  `;
}

function renderNavbar(isLast, test){
  const nb = document.getElementById('navbar');
  nb.innerHTML = `
    <button class="btn ghost" id="btnMenu">Modelltests</button>
    <span class="foot-note">Niveau C1 · Hörverstehen</span>
    <button class="btn next" id="btnNext">${isLast ? 'Ergebnisse' : 'Aufgabe '+(current+2)+' →'}</button>
  `;
  document.getElementById('btnMenu').onclick = ()=>{
    if(confirm('Zurück zur Auswahlliste? Ihre Antworten bleiben gespeichert.')) showTestSelect();
  };
  document.getElementById('btnNext').onclick = ()=>{
    if(isLast){ showResults(); } else { current++; renderTask(); }
  };
}

function renderTask(){
  const test = HOREN_TESTS[currentTestIdx];
  const task = test.teile[current];
  renderTaskbar(task, test);
  
  const main = document.getElementById('main');
  
  let mediaHtml = '';
  if(task.mediaType === 'audio' && task.mediaUrl){
    mediaHtml = `<div class="media-box" style="background:#f4f6f8; padding:15px; border-radius:8px; margin-bottom:20px; text-align:center;">
      <p id="mediaStatus" style="font-weight:bold; margin-bottom:8px; color:var(--teal-dark);">🎧 Audiospur abspielen:</p>
      <audio id="sequentialAudio" controls controlsList="nodownload" style="width:100%; max-width:500px;">
        Ihr Browser unterstützt das Audio-Element nicht.
      </audio>
    </div>`;
  } else if(task.mediaType === 'video' && task.mediaUrl){
    let extraVisual = '';
    if(task.teil === 5) {
      extraVisual = `
        <div style="background:#fff; border:1px solid #ccc; border-radius:6px; padding:15px; margin-bottom:15px; text-align:center;">
          <h3 style="margin-bottom:12px; font-size:1.2rem; color:#333;">Anatomie der Nase</h3>
          <div style="display:flex; justify-content:center; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:15px;">
            <img src="media/anatomie_nase.png" alt="Anatomie der Nase" style="max-width:350px; height:auto; border:1px solid #ddd; border-radius:4px;">
            <div style="border:1px solid #ddd; padding:10px; border-radius:4px; background:#fafafa; display:flex; flex-direction:column; align-items:center;">
              <video id="sequentialVideo" controls controlsList="nodownload" style="width:100%; max-width:280px; border-radius:4px; display:block;">
                <source src="${task.mediaUrl}" type="video/mp4">
                Ihr Browser unterstützt das Video-Element nicht.
              </video>
            </div>
          </div>
        </div>`;
    } else {
      extraVisual = `
        <video id="sequentialVideo" controls controlsList="nodownload" style="width:100%; max-width:600px; border-radius:6px; display:block; margin: 0 auto;">
          <source src="${task.mediaUrl}" type="video/mp4">
          Ihr Browser unterstützt das Video-Element nicht.
        </video>`;
    }

    mediaHtml = `<div class="media-box" style="background:#f4f6f8; padding:15px; border-radius:8px; margin-bottom:20px; text-align:center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <p id="mediaStatus" style="font-weight:bold; margin-bottom:8px; color:var(--teal-dark);">🎥 Videosequenz abspielen:</p>
      ${extraVisual}
    </div>`;
  }

  main.innerHTML = `<h2 class="task-title">${task.title}</h2>${mediaHtml}<div id="taskBody"></div>`;
  const body = document.getElementById('taskBody');

  // Gestion des flux audio (Aufgaben 1, 2, 3, 6, 7)
  if(task.mediaType === 'audio' && task.mediaUrl) {
    const player = document.getElementById('sequentialAudio');
    const statusText = document.getElementById('mediaStatus');
    
    let playlist = [];
    if(task.teil === 1) {
      playlist = [
        { type: 'audio', src: 'media/consigne_t1.mp3', label: '🎧 Anweisung wird abgespielt...' },
        { type: 'pause', duration: 15000, label: '⏱️ Pause (15s)...' },
        { type: 'audio', src: 'media/exercice_t1.mp3', label: '🎧 Haupttext läuft...' },
        { type: 'pause_end', duration: 20000, label: '⏱️ Nachbereitung...' }
      ];
    } else if(task.teil === 2) {
      playlist = [
        { type: 'audio', src: 'media/consigne_t2.mp3', label: '🎧 Anweisung wird abgespielt...' },
        { type: 'audio', src: 'media/exercice_t2.mp3', label: '🎧 Podiumsdiskussion läuft...' },
        { type: 'pause_end', duration: 180000, label: '⏱️ Nachbereitung: Sie haben 3 Minuten Zeit...' }
      ];
    } else if(task.teil === 3) {
      playlist = [
        { type: 'audio', src: 'media/consigne_t3.mp3', label: '🎧 Anweisung wird abgespielt...' },
        { type: 'audio', src: task.mediaUrl, label: '🎧 Vorlesung läuft...' },
        { type: 'pause_end', duration: 150000, label: '⏱️ Bearbeitungszeit: Sie haben 2 Minuten und 30 Sekunden Zeit...' }
      ];
    } else if(task.teil === 6) {
      playlist = [
        { type: 'audio', src: 'media/consigne_t6.mp3', label: '🎧 Anweisung wird abgespielt...' },
        { type: 'pause', duration: 90000, label: '⏱️ Lesezeit: Sie haben 1 Minute und 30 Sekunden Zeit, um die Fragen zu lesen...' },
        { type: 'audio', src: 'media/exercice_t6.mp3', label: '🎧 Vortrag läuft...' },
        { type: 'pause_end', duration: 90000, label: '⏱️ Nachbereitung: Sie haben 1 Minute und 30 Sekunden Zeit, um Ihre Antworten zu kontrollieren...' }
      ];
    } else {
      playlist = [
        { type: 'audio', src: task.mediaUrl, label: '🎧 Audiospur abspielen:' }
      ];
    }

    let currentIndex = 0;
    let isPlayingSequence = false;
    let pauseInterval = null;

    function playSequence(index) {
      if (index >= playlist.length) {
        const testObj = HOREN_TESTS[currentTestIdx];
        if (current < testObj.teile.length - 1) { current++; renderTask(); } else { showResults(); }
        return;
      }
      
      let currentItem = playlist[index];
      if(statusText) statusText.innerText = currentItem.label;

      if (currentItem.type === 'audio') {
        player.src = currentItem.src;
        player.load();
        player.play().catch(e => console.log("Autoplay bloqué ou erreur de lecture :", e));
        
        player.onended = function() {
          currentIndex++;
          playSequence(currentIndex);
        };
      } else {
        player.pause();
        player.removeAttribute('src');
        
        let remaining = currentItem.duration / 1000;
        if(pauseInterval) clearInterval(pauseInterval);

        pauseInterval = setInterval(() => {
          remaining--;
          let mins = Math.floor(remaining / 60);
          let secs = remaining % 60;
          if(statusText) {
            if(task.teil === 2 && currentItem.type === 'pause_end') {
              statusText.innerText = `⏱️ Nachbereitung: ${mins}:${secs < 10 ? '0' : ''}${secs} verbleibend...`;
            } else if(task.teil === 3 && currentItem.type === 'pause_end') {
              statusText.innerText = `⏱️ Bearbeitungszeit: ${mins}:${secs < 10 ? '0' : ''}${secs} verbleibend...`;
            } else if(task.teil === 6 && (currentItem.type === 'pause' || currentItem.type === 'pause_end')) {
              statusText.innerText = `⏱️ ${currentItem.label.split(':')[0]}: ${mins}:${secs < 10 ? '0' : ''}${secs} verbleibend...`;
            } else {
              statusText.innerText = `⏱️ Pause: ${secs}s verbleibend...`;
            }
          }
          if (remaining <= 0) {
            clearInterval(pauseInterval);
          }
        }, 1000);

        setTimeout(function() {
          clearInterval(pauseInterval);
          currentIndex++;
          playSequence(currentIndex);
        }, currentItem.duration);
      }
    }

    player.addEventListener('play', function() {
      if (!isPlayingSequence) {
        isPlayingSequence = true;
        currentIndex = 0;
        player.pause();
        playSequence(0);
      }
    });

  // Gestion des flux vidéo (Aufgaben 4 et 5)
  } else if(task.mediaType === 'video' && task.mediaUrl) {
    const player = document.getElementById('sequentialVideo');
    const statusText = document.getElementById('mediaStatus');

    let playlist = [];
    if(task.teil === 4) {
      playlist = [
        { type: 'audio', src: 'media/consigne_t4.mp3', label: '🎧 Anweisung wird abgespielt...' },
        { type: 'pause', duration: 45000, label: '⏱️ Lesezeit: Sie haben 45 Sekunden Zeit, um die Aussagen zu lesen...' },
        { type: 'video', src: task.mediaUrl, label: '🎥 Videosequenz läuft (Sie sehen das Video einmal)...' },
        { type: 'pause_end', duration: 45000, label: '⏱️ Nachbereitung: Sie haben 45 Sekunden Zeit, um Ihre Antworten zu kontrollieren...' }
      ];
    } else if(task.teil === 5) {
      playlist = [
        { type: 'audio', src: 'media/consigne_t5.mp3', label: '🎧 Anweisung wird abgespielt...' },
        { type: 'pause', duration: 10000, label: '⏱️ Lesezeit: Sie haben 10 Sekunden Zeit, sich die Gliederungspunkte anzuschauen...' },
        { type: 'video', src: task.mediaUrl, label: '🎥 Videosequenz läuft (Sie sehen das Video einmal)...' },
        { type: 'pause_end', duration: 180000, label: '⏱️ Nachbereitung: Sie haben 3 Minuten Zeit, um Ihre Antworten zu kontrollieren...' }
      ];
    } else {
      playlist = [
        { type: 'video', src: task.mediaUrl, label: '🎥 Videosequenz abspielen:' }
      ];
    }

    let currentIndex = 0;
    let isPlayingSequence = false;
    let pauseInterval = null;

    function playVideoSequence(index) {
      if (index >= playlist.length) {
        const testObj = HOREN_TESTS[currentTestIdx];
        if (current < testObj.teile.length - 1) { current++; renderTask(); } else { showResults(); }
        return;
      }
      
      let currentItem = playlist[index];
      if(statusText) statusText.innerText = currentItem.label;

      if (currentItem.type === 'audio') {
        if(player) player.style.display = 'none';
        
        let audioTemp = new Audio(currentItem.src);
        audioTemp.play().catch(e => console.log("Autoplay bloqué ou erreur audio :", e));
        
        audioTemp.onended = function() {
          currentIndex++;
          playVideoSequence(currentIndex);
        };
      } else if (currentItem.type === 'video') {
        if(player) {
          player.style.display = 'block';
          player.src = currentItem.src;
          player.load();
          player.play().catch(e => console.log("Autoplay bloqué ou erreur vidéo :", e));
          
          player.onended = function() {
            currentIndex++;
            playVideoSequence(currentIndex);
          };
        }
      } else {
        if(player) {
          player.pause();
          if(task.teil === 4 || task.teil === 5) {
            player.style.display = 'block';
          } else {
            player.style.display = 'none';
          }
        }
        
        let remaining = currentItem.duration / 1000;
        if(pauseInterval) clearInterval(pauseInterval);

        pauseInterval = setInterval(() => {
          remaining--;
          let mins = Math.floor(remaining / 60);
          let secs = remaining % 60;
          if(statusText) {
            if(task.teil === 5 && currentItem.type === 'pause_end') {
              statusText.innerText = `⏱️ Nachbereitung: ${mins}:${secs < 10 ? '0' : ''}${secs} verbleibend...`;
            } else if(currentItem.type === 'pause' || currentItem.type === 'pause_end') {
              statusText.innerText = `⏱️ ${currentItem.label.split(':')[0]}: ${secs}s verbleibend...`;
            } else {
              statusText.innerText = `⏱️ Pause: ${secs}s verbleibend...`;
            }
          }
          if (remaining <= 0) {
            clearInterval(pauseInterval);
          }
        }, 1000);

        setTimeout(function() {
          clearInterval(pauseInterval);
          currentIndex++;
          playVideoSequence(currentIndex);
        }, currentItem.duration);
      }
    }

    if(player) {
      player.addEventListener('play', function() {
        if (!isPlayingSequence) {
          isPlayingSequence = true;
          currentIndex = 0;
          player.pause();
          playVideoSequence(0);
        }
      });
    }
  }

  // Rendu des tâches selon leur type
  switch(task.type){
    case 'kurz_uebersicht':
    case 'kurz_vortrag':
      renderKurzAntwort(task, test, body);
      break;
    case 'kurz_begriff':
      if(task.teil === 2) {
        renderPodiumAntwort(task, test, body);
      } else {
        renderMatchHoeren(task, test, body);
      }
      break;
    case 'match_personen':
      renderMatchHoeren(task, test, body);
      break;
    case 'summary_hoer':
    case 'laut_schrift':
      renderSummaryHoeren(task, test, body);
      break;
    case 'mc_hoeren':
      renderMCHoeren(task, test, body);
      break;
  }
  renderNavbar(current === test.teile.length-1, test);
  window.scrollTo({top:0, behavior:'instant'});
}

function renderKurzAntwort(task, test, body){
  const a = getBucket(test, task);
  if(task.teil === 1) {
    let html = `
      <div class="passage" style="max-width: 800px; margin: 0 auto; background: #fff; color: #000; padding: 25px; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h3 style="margin-bottom: 20px; font-size: 1.2rem; border-bottom: 2px solid #333; padding-bottom: 8px;">Nutzung der Universitätsbibliothek</h3>
        <div style="border: 1px solid #b5b5b5; display: flex; flex-direction: column;">
          <div style="border-bottom: 1px solid #b5b5b5; padding: 12px 15px;">
            <div style="font-weight: bold; margin-bottom: 4px;">Öffnungszeiten:</div>
            <div style="font-size: 0.95rem; color: #333;">Montag bis Freitag 8.00 bis 24.00 Uhr</div>
            <div style="font-size: 0.95rem; color: #333;">Samstag und Sonntag 8.00 bis 23.00 Uhr</div>
          </div>
          <div style="border-bottom: 1px solid #b5b5b5; padding: 12px 15px;">
            <div style="font-weight: bold; margin-bottom: 4px;">Nutzung der Schließfächer:</div>
            <div style="font-size: 0.95rem; color: #333; margin-bottom: 8px;">Montag bis Sonntag</div>
            <input type="text" class="kurz-input" data-qi="0" value="${escapeHtml(a[0]||'')}" placeholder="Antwort eingeben (max. 2 Wörter)..." style="width: 100%; padding: 8px; border: 1px solid #888; border-radius: 4px; font-size: 0.95rem;">
          </div>
          <div style="border-bottom: 1px solid #b5b5b5; padding: 12px 15px;">
            <div style="font-weight: bold; margin-bottom: 4px;">Öffnungszeiten Bibliothekscafé:</div>
            <div style="font-size: 0.95rem; color: #333;">Montag bis Freitag 10.00 bis 18.00 Uhr</div>
          </div>
          <div style="border-bottom: 1px solid #b5b5b5; padding: 12px 15px;">
            <div style="font-weight: bold; margin-bottom: 4px;">Erlaubte Getränke in der Bibliothek:</div>
            <input type="text" class="kurz-input" data-qi="1" value="${escapeHtml(a[1]||'')}" placeholder="Antwort eingeben (max. 2 Wörter)..." style="width: 100%; padding: 8px; border: 1px solid #888; border-radius: 4px; font-size: 0.95rem;">
          </div>
          <div style="border-bottom: 1px solid #b5b5b5; padding: 12px 15px;">
            <div style="font-weight: bold; margin-bottom: 4px;">Maximale Ausleihfrist für Bücher:</div>
            <input type="text" class="kurz-input" data-qi="2" value="${escapeHtml(a[2]||'')}" placeholder="Antwort eingeben (max. 2 Wörter)..." style="width: 100%; padding: 8px; border: 1px solid #888; border-radius: 4px; font-size: 0.95rem;">
          </div>
          <div style="border-bottom: 1px solid #b5b5b5; padding: 12px 15px;">
            <div style="font-weight: bold; margin-bottom: 4px;">Strafgebühr bei verspäteter Bücherrückgabe:</div>
            <div style="font-size: 0.95rem; color: #333;">Fünf Euro pro Buch pro Tag</div>
          </div>
          <div style="border-bottom: 1px solid #b5b5b5; padding: 12px 15px;">
            <div style="font-weight: bold; margin-bottom: 4px;">Nicht ausleihbare Bücher:</div>
            <input type="text" class="kurz-input" data-qi="3" value="${escapeHtml(a[3]||'')}" placeholder="Antwort eingeben (max. 2 Wörter)..." style="width: 100%; padding: 8px; border: 1px solid #888; border-radius: 4px; font-size: 0.95rem;">
          </div>
          <div style="border-bottom: 1px solid #b5b5b5; padding: 12px 15px;">
            <div style="font-weight: bold; margin-bottom: 4px;">Fernleihe:</div>
            <div style="font-size: 0.95rem; color: #333;">Bücher kommen innerhalb von zwei bis drei Tagen</div>
          </div>
          <div style="padding: 12px 15px;">
            <div style="font-weight: bold; margin-bottom: 4px;">Lernräume für Lerngruppen:</div>
            <div style="font-size: 0.95rem; color: #333; margin-bottom: 8px;">2. Stock,</div>
            <input type="text" class="kurz-input" data-qi="4" value="${escapeHtml(a[4]||'')}" placeholder="Antwort eingeben (max. 2 Wörter)..." style="width: 100%; padding: 8px; border: 1px solid #888; border-radius: 4px; font-size: 0.95rem;">
          </div>
        </div>
      </div>
    `;
    body.innerHTML = html;
  } else if(task.teil === 5) {
    let html = `
      <div class="passage" style="max-width: 900px; margin: 0 auto; background: #fff; color: #000; padding: 25px; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h3 style="margin-bottom: 15px; font-size: 1.2rem; border-bottom: 2px solid #333; padding-bottom: 8px;">Anosmie</h3>
        <div style="border: 1px solid #b5b5b5; display: flex; flex-direction: column;">
    `;
    task.questions.forEach((item, qi)=>{
      const borderStyle = qi < task.questions.length - 1 ? 'border-bottom: 1px solid #b5b5b5;' : '';
      html += `
        <div style="${borderStyle} padding: 12px 15px; display: flex; flex-direction: column; gap: 8px;">
          <div style="font-weight: bold; font-size: 0.95rem; color: #222;">${escapeHtml(item.q)}</div>
          <input type="text" class="kurz-input" data-qi="${qi}" value="${escapeHtml(a[qi]||'')}" placeholder="${escapeHtml(item.placeholder || 'Stichpunkt eingeben...')}" style="width: 100%; padding: 8px; border: 1px solid #888; border-radius: 4px; font-size: 0.95rem;">
        </div>
      `;
    });
    html += `</div></div>`;
    body.innerHTML = html;
  } else {
    let html = '<div class="passage" style="display:flex; flex-direction:column; gap:12px;">';
    task.questions.forEach((item, qi)=>{
      html += `<div style="display:flex; align-items:center; gap:10px;">
        <strong style="min-width:250px;">${escapeHtml(item.q)}</strong>
        <input type="text" class="kurz-input" data-qi="${qi}" value="${escapeHtml(a[qi]||'')}" placeholder="Antwort eingeben..." style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px;">
      </div>`;
    });
    html += '</div>';
    body.innerHTML = html;
  }
  body.querySelectorAll('.kurz-input').forEach(inp=>{
    inp.addEventListener('input', ()=> a[inp.dataset.qi] = inp.value);
  });
}

function renderPodiumAntwort(task, test, body){
  const a = getBucket(test, task);
  let html = `<div class="passage" style="max-width: 900px; margin: 0 auto; background: #fff; color: #000; padding: 25px; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">`;
  
  let globalIdx = 0;
  task.personsData.forEach((person, pi) => {
    html += `
      <div style="border: 1px solid #b5b5b5; margin-bottom: 20px; border-radius: 4px;">
        <div style="background: #f0f2f5; padding: 10px 15px; font-weight: bold; border-bottom: 1px solid #b5b5b5; font-size: 1rem;">${escapeHtml(person.name)}</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; min-height: 120px;">
    `;
    person.fields.forEach((f, fi) => {
      const currentQi = globalIdx++;
      html += `
        <div style="padding: 12px 15px; border-right: ${fi === 0 ? '1px solid #b5b5b5' : 'none'}; display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <div style="font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; color: #444;">${escapeHtml(f.label)}</div>
            <div style="font-size: 0.85rem; color: #666; margin-bottom: 8px;">(${currentQi + 1})</div>
          </div>
          <textarea class="podium-input" data-qi="${currentQi}" placeholder="${escapeHtml(f.placeholder)}" style="width: 100%; height: 70px; padding: 8px; border: 1px solid #888; border-radius: 4px; font-size: 0.95rem; resize: vertical;">${escapeHtml(a[currentQi]||'')}</textarea>
        </div>
      `;
    });
    html += `</div></div>`;
  });

  html += `</div>`;
  body.innerHTML = html;

  body.querySelectorAll('.podium-input').forEach(inp=>{
    inp.addEventListener('input', ()=> a[inp.dataset.qi] = inp.value);
  });
}

function renderMatchHoeren(task, test, body){
  const a = getBucket(test, task);
  let html = '<div class="passage"><table style="width:100%; border-collapse:collapse;">';
  const list = task.pairs || task.items;
  list.forEach((item, ii)=>{
    html += `<tr style="border-bottom:1px solid #eee;"><td style="padding:10px; font-weight:bold;">${escapeHtml(item.term || item.text)}</td><td style="padding:10px;">`;
    const opts = item.options || task.columns;
    opts.forEach((opt, oi)=>{
      const checked = a[ii] == oi ? 'checked' : '';
      html += `<label style="margin-right:15px;"><input type="radio" name="match${ii}" value="${oi}" ${checked}> ${escapeHtml(opt)}</label>`;
    });
    html += `</td></tr>`;
  });
  html += '</table></div>';
  body.innerHTML = html;
  list.forEach((_, ii)=>{
    body.querySelectorAll(`input[name="match${ii}"]`).forEach(inp=>{
      inp.addEventListener('change', ()=> a[ii] = inp.value);
    });
  });
}

function renderSummaryHoeren(task, test, body){
  const a = getBucket(test, task);
  let html = '<div class="passage" style="max-width: 850px; margin: 0 auto; background: #fff; color: #000; padding: 25px; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); line-height: 1.8; font-size: 1.05rem;">';
  html += '<h3 style="margin-bottom: 15px; font-size: 1.2rem; border-bottom: 2px solid #333; padding-bottom: 8px;">Zusammenfassung</h3><p>';
  
  const segmentsList = task.segments || task.sentences;
  segmentsList.forEach((seg, si)=>{
    const isSelected = a[si] ? 'background-color: #ffeb3b; border-bottom: 2px solid #fbc02d;' : 'background-color: transparent;';
    html += `<span class="text-segment" data-si="${si}" style="cursor: pointer; padding: 2px 4px; border-radius: 3px; transition: background 0.2s; ${isSelected}">${escapeHtml(seg.text)} </span>`;
  });
  
  html += '</p><p style="margin-top: 15px; font-size: 0.9rem; color: #666; font-style: italic;">💡 Hinweis: Klicken Sie auf die Sätze im Text, die Ihrer Meinung nach falsche Informationen enthalten (Satz markieren/aufheben).</p></div>';
  body.innerHTML = html;

  body.querySelectorAll('.text-segment').forEach(span=>{
    span.addEventListener('click', ()=>{
      const si = span.dataset.si;
      a[si] = !a[si];
      renderSummaryHoeren(task, test, body);
    });
  });
}

function renderMCHoeren(task, test, body){
  const a = getBucket(test, task);
  let html = '<div class="passage">';
  task.questions.forEach((q, qi)=>{
    html += `<div class="qblock" style="margin-bottom:15px;"><div class="qtext" style="font-weight:bold; margin-bottom:5px;">${escapeHtml(q.q)}</div>`;
    q.options.forEach((opt, oi)=>{
      const checked = a[qi] == oi ? 'checked' : '';

    });

  });
  html += '</div>';
  body.innerHTML = html;
  task.questions.forEach((_, qi)=>{
    body.querySelectorAll(`input[name="mcq${qi}"]`).forEach(inp=>{
      inp.addEventListener('change', ()=> a[qi] = inp.value);
    });

}

function scoreTask(task, test){
  const a = getBucket(test, task);
  let correct = 0, total = 0;
  switch(task.type){
    case 'kurz_uebersicht':
    case 'kurz_vortrag':
      total = task.questions.length;
      task.questions.forEach((item, i)=>{
        if(a[i] && item.correct && a[i].trim().toLowerCase() === item.correct.toLowerCase()) correct++;
      });
      break;
    case 'kurz_begriff':
      if(task.teil === 2) {
        total = 4;
        for(let i=0; i<4; i++){
          if(a[i] && a[i].trim().length > 0) correct++;
        }
      } else {
        const list = task.pairs || task.items;
        total = list.length;
        list.forEach((item, i)=>{
          if(parseInt(a[i]) === item.correct) correct++;
        });
      }
      break;
    case 'match_personen':
      const list = task.pairs || task.items;
      total = list.length;
      list.forEach((item, i)=>{
        if(parseInt(a[i]) === item.correct) correct++;
      });
      break;
    case 'summary_hoer':
    case 'laut_schrift':
      const segs = task.segments || task.sentences;
      total = segs.filter(s=>s.wrong).length;
      segs.forEach((s, i)=>{
        if(s.wrong && a[i]) correct++;
      });
      break;
    case 'mc_hoeren':
      total = task.questions.length;
      task.questions.forEach((q, i)=>{
        if(parseInt(a[i]) === q.correct) correct++;
      });
      break;
  }
  return {correct, total};
}

function showResults(){
  document.getElementById('taskbar').innerHTML = '';
  const test = HOREN_TESTS[currentTestIdx];
  const nb = document.getElementById('navbar');
  nb.innerHTML = '<button class="btn ghost" id="btnRestart">Recommencer</button><button class="btn next" id="btnMenu2">Menu</button>';

  document.getElementById('btnRestart').onclick = () => {
    hoerenAnswers[test.id] = {};
    current = 0;
    renderTask();
  };
  document.getElementById('btnMenu2').onclick = () => showTestSelect();

  let sumCorrect = 0, sumTotal = 0;
  let rows = '';
  test.teile.forEach(task => {
    const {correct, total} = scoreTask(task, test);
    let tdn = 'unterhalb TDN 3';
    sumCorrect += correct; sumTotal += total;
    rows += `<div class="result-row"><span>Aufgabe ${task.teil} - ${task.label}</span><span class="${correct === total ? 'ok' : 'no'}">${correct} / ${total}</span></div>`;
  });
  const pct = sumTotal ? Math.round((sumCorrect/sumTotal)*100) : 0;
  if(pct >= 88) tdn = 'TDN 5 (Sehr gut / C1.2)'; else if(pct >= 67) tdn = 'TDN 4 (Gut / C1.1)';

  document.getElementById('main').innerHTML = `
  <div class="results">
    <div class="score-hero">
      <div class="pct">${pct}%</div>
      <div class="tdn">${tdn}</div>
      <div class="tdn" style="margin-top:6px;">${sumCorrect} von ${sumTotal} Punkten erreicht</div>
    </div>
    <h2>Hörverstehen — Resultate</h2>
    ${rows}
  </div>`;
}

showTestSelect();
</script>
