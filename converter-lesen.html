<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertisseur Lesen Idéal</title>
<style>
:root{--bg:#fff;--fg:#1c1c1c;--mut:#666;--bd:#d8d8d8;--err:#b42318;--errbg:#fdecea;--wrn:#9a5b00;--wrnbg:#fff4e0;--ok:#1e6b34;--okbg:#e6f4ea}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--bd:#3a3a3a;--err:#ff8a80;--errbg:#3a1d1b;--wrn:#ffcc80;--wrnbg:#3a2c12;--ok:#81c995;--okbg:#17301f}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:900px;margin:0 auto;padding:12px;line-height:1.45}
h1{font-size:1.3rem;margin:.2em 0}h3{font-size:1rem;margin:14px 0 4px}
.mut{color:var(--mut);font-size:.9rem}
textarea{width:100%;box-sizing:border-box;font-family:ui-monospace,monospace;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
button, input[type=file]{padding:8px;font-size:14px}
.box{padding:9px 11px;border-radius:8px;margin:5px 0;font-size:.95rem;word-break:break-word}
.error{background:var(--errbg);color:var(--err)}.warn{background:var(--wrnbg);color:var(--wrn)}.ok{background:var(--okbg);color:var(--ok)}
details{margin:8px 0}pre{white-space:pre-wrap;font-size:.82rem;margin:6px 0}code{font-family:ui-monospace,monospace;font-size:.85rem}
</style>
</head><body>
<h1>Convertisseur Lesen → lesen-data.js (Modèle Idéal)</h1>
<p class="mut">Sélectionnez vos fichiers ou collez votre texte structuré ci-dessous.</p>

<div class="row">
  <label for="fileInput"><b>Importer des fichiers :</b></label>
  <input type="file" id="fileInput" multiple accept=".txt,.md">
</div>

<div class="row"><button id="conv">Convertir</button></div>
<textarea id="in" rows="16" placeholder="#MT 8&#10;#TITEL Modelltest 8&#10;&#10;#TEIL 1&#10;#TITEL ..."></textarea>
<div id="sum"></div>
<div id="issues"></div>

<h3>1. Bloc à coller dans lesen-data.js</h3>
<textarea id="out1" rows="10" readonly></textarea>
<div class="row"><button id="c1">Copier le bloc</button></div>

<h3>2. Ligne à ajouter dans <code>TESTS</code></h3>
<textarea id="out2" rows="2" readonly></textarea>
<div class="row"><button id="c2">Copier la ligne</button></div>

<script>
var TEMPLATE=[
  {teil:1,type:'gap',time:240,label:'Lückentext ergänzen'},
  {teil:2,type:'order',time:300,label:'Textabschnitte ordnen'},
  {teil:3,type:'mc',time:900,label:'Multiple Choice (C1 Level)'},
  {teil:4,type:'match',time:360,label:'Textstellen zuordnen (C1 Level)'},
  {teil:5,type:'table',time:540,label:'Aussagen Kategorien zuordnen'},
  {teil:6,type:'twocat',time:420,label:'Vorteile / Nachteile Zuordnung (C1 Level)'},
  {teil:7,type:'summary',time:420,label:'Fehler in Zusammenfassung erkennen'}
];
var DEF=[
  'Lesen Sie den Text. Wählen Sie für jede Lücke das passende Wort.',
  'Bringen Sie die fünf Textabschnitte mit den Pfeiltasten in die richtige Reihenfolge.',
  'Lesen Sie den wissenschaftlichen Text. Beantworten Sie die Fragen mit den Optionen a, b, c oder d.',
  'Lesen Sie den Expertenkommentar. Ordnen Sie die Textstellen 1 – 4 den Aussagen unten zu. Für jede Textstelle gibt es genau eine richtige Lösung.',
  'Lesen Sie den Text. Ordnen Sie die Aussagen 1–7 zu den Kategorien zu.',
  'Lesen Sie den Text. Entscheiden Sie, welche Aussagen stimmen, und ordnen Sie genau vier Aussagen der Tabelle zu (2 Vorteile, 2 Nachteile).',
  'Kreuzen Sie genau drei Sätze an, die inhaltlich falsche Informationen enthalten.'
];
var DIR=['MT','TITEL','TEIL','ANWEISUNG','TEXT','LUECKEN','ABSCHNITTE','FRAGEN','AUSSAGEN','SPALTEN','GRAFIK','SAETZE','GRAFIKSVG'];

function q(s){return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";}
function tl(s){return '`'+String(s).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${')+'`';}
function para(lines){
  var out=[],buf=[];
  lines.forEach(function(l){if(l.trim()===''){if(buf.length)out.push(buf.join(' ').replace(/\s+/g,' ').trim());buf=[];}else buf.push(l.trim());});
  if(buf.length)out.push(buf.join(' ').replace(/\s+/g,' ').trim());
  return out;
}
function plain(lines){return para(lines).join(' ').replace(/\*\*(.+?)\*\*/g,'$1');}
function html(lines){return para(lines).join('<br><br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

function parse(src){
  var E=[],mt={id:null,title:'',teile:[]},cur=null,blk=null;
  src.split(/\r?\n/).forEach(function(raw,ln){
    var m=raw.match(/^\s*#([A-Za-zÄÖÜäöüß]+)\s*(.*)$/);
    if(m){
      var d=m[1].toUpperCase(),v=m[2].trim();
      if(d==='MT'){mt.id=parseInt(v,10);blk=null;return;}
      if(d==='TEIL'){cur={n:parseInt(v,10),titel:'',anw:'',blocks:{},spalten:'',grafik:''};mt.teile.push(cur);blk=null;return;}
      if(d==='TITEL'){if(cur)cur.titel=v;else mt.title=v;blk=null;return;}
      if(!cur)return;
      if(d==='ANWEISUNG'){cur.anw=v;blk=null;return;}
      if(d==='SPALTEN'){cur.spalten=v;blk=null;return;}
      if(d==='GRAFIK')cur.grafik=v;
      cur.blocks[d]=cur.blocks[d]||[];blk=cur.blocks[d];return;
    }
    if(blk)blk.push(raw);
  });
  return {mt:mt,E:E};
}

function bGap(t){
  var txt=para(t.blocks.TEXT||[]).join(' ');
  var segs=txt.split(/\{(\d+)\}/);
  var gaps=[];var gl={};
  (t.blocks.LUECKEN||[]).forEach(function(l){
    var m=l.match(/^\s*(\d+)\)\s*(.*)$/);
    if(m) gl[+m[1]]=m[2];
  });
  var cleanSegs=[segs[0]];
  for(var i=1; i<segs.length; i+=2) cleanSegs.push(segs[i+1]||'');
  Object.keys(gl).sort(function(a,b){return a-b;}).forEach(function(k){
    var parts=gl[k].split('|').map(function(p){return p.trim();});
    var correct=0;
    var opts=parts.map(function(p,idx){if(p.charAt(0)==='*'){correct=idx;return p.slice(1).trim();}return p;});
    gaps.push({options:opts, correct:correct});
  });
  return {segments:cleanSegs, gaps:gaps};
}

function bOrder(t){
  var items=(t.blocks.ABSCHNITTE||[]).filter(function(l){return l.trim();}).map(function(l){return l.trim().replace(/^\d+[\).]\s*/,'');});
  var idx=items.map(function(_,i){return i;});
  return {correctOrder:idx, items:items, shuffledStart:shuffle(idx)};
}

function bMc(t){
  var qs=[],cur=null;
  (t.blocks.FRAGEN||[]).forEach(function(raw){
    var l=raw.trim();if(!l)return;
    var m=l.match(/^F:\s*(.*)$/);
    if(m){cur={q:m[1],options:[],correct:0};qs.push(cur);return;}
    var o=l.match(/^(\*?)\s*([a-dA-D])\)\s*(.*)$/);
    if(o&&cur){if(o[1]) cur.correct=cur.options.length; cur.options.push(o[3]);}
  });
  return {passage:para(t.blocks.TEXT||[]), questions:qs};
}

function bMatch(t){
  var opts=[],map={};
  (t.blocks.AUSSAGEN||[]).forEach(function(raw){
    var l=raw.trim();if(!l)return;
    var m=l.match(/^(.*?)\s*=>\s*([1-4])\s*$/);
    if(m){map[+m[2]]=opts.length;}
    opts.push(m?m[1]:l);
  });
  var corr=[1,2,3,4].map(function(k){return map[k]!==undefined?map[k]:0;});
  return {passageText:html(t.blocks.TEXT||[]), textStellen:[1,2,3,4], options:opts, correct:corr};
}

function bTable(t){
  var cols=t.spalten.split('|').map(function(s){return s.trim();}).filter(Boolean);
  var items=[];
  (t.blocks.AUSSAGEN||[]).forEach(function(raw){
    var l=raw.trim();if(!l)return;
    var m=l.match(/^(.*?)\s*=>\s*(\d+)\s*$/);
    if(m){items.push({text:m[1], correct:+m[2]-1});}
  });
  return {passage:plain(t.blocks.TEXT||[]), columns:cols, items:items};
}

function bTwo(t){
  var as=[],cm={};
  var TG={V1:'v1',V2:'v2',N3:'n3',N4:'n4'};
  (t.blocks.AUSSAGEN||[]).forEach(function(raw){
    var l=raw.trim();if(!l)return;
    var m=l.match(/^([a-z])\)\s*(.*?)(?:\s*=>\s*([A-Za-z][0-9]))?\s*$/);
    if(m){
      as.push({key:m[1], text:'['+m[1]+'] '+m[2]});
      if(m[3]){var k=TG[m[3].toUpperCase()];if(k)cm[k]=m[1];}
    }
  });
  return {passage:plain(t.blocks.TEXT||[]), aussagen:as, correctMap:cm};
}

function bSum(t){
  var gd=[],ss=[];
  (t.blocks.GRAFIK||[]).forEach(function(raw){
    var m=raw.trim().match(/^(.*?)\s*=\s*(-?\d+(?:[.,]\d+)?)$/);
    if(m)gd.push({year:m[1],val:parseFloat(m[2].replace(',','.'))});
  });
  (t.blocks.SAETZE||[]).forEach(function(raw){
    var l=raw.trim();if(!l)return;
    var w=l.charAt(0)==='!';
    ss.push({text:(w?l.slice(1):l).trim(), wrong:w});
  });
  var o={passage:plain(t.blocks.TEXT||[])};
  if(gd.length){o.graphicData=gd;o.graphicCaption=t.grafik;}
  var sv=(t.blocks.GRAFIKSVG||[]).join('').trim();
  if(sv)o.graphicSvg=sv;
  o.sentences=ss;
  return o;
}

var BUILD=[bGap,bOrder,bMc,bMatch,bTable,bTwo,bSum];

function ser(p,n){
  var F=['    instructions:'+q(p.instructions),'    title:'+q(p.title)];
  function lst(a,f,ind){return '[\n'+a.map(function(x){return ind+f(x);}).join(',\n')+'\n    ]';}
  var ty=p.type;
  if(ty==='gap'){
    F.push('    segments:'+lst(p.segments,q,'      '));
    F.push('    gaps:'+lst(p.gaps,function(g){return '{options:['+g.options.map(q).join(',')+'], correct:'+g.correct+'}';},'      '));
  }else if(ty==='order'){
    F.push('    correctOrder:['+p.correctOrder.join(',')+']');
    F.push('    items:'+lst(p.items,q,'      '));
    F.push('    shuffledStart:['+p.shuffledStart.join(',')+']');
  }else if(ty==='mc'){
    F.push('    passage:'+lst(p.passage,q,'      '));
    F.push('    questions:'+lst(p.questions,function(x){return '{ q:'+q(x.q)+', options:[\n'+x.options.map(function(o){return '        '+q(o);}).join(',\n')+'\n      ], correct:'+x.correct+' }';},'      '));
  }else if(ty==='match'){
    F.push('    passageText:'+tl(p.passageText));
    F.push('    textStellen:[1, 2, 3, 4]');
    F.push('    options:'+lst(p.options,q,'      '));
    F.push('    correct:['+p.correct.join(', ')+']');
  }else if(ty==='table'){
    F.push('    passage:'+q(p.passage));
    F.push('    columns:['+p.columns.map(q).join(',')+']');
    F.push('    items:'+lst(p.items,function(x){return '{text:'+q(x.text)+', correct:'+x.correct+'}';},'      '));
  }else if(ty==='twocat'){
    F.push('    passage:'+q(p.passage));
    F.push('    aussagen:'+lst(p.aussagen,function(a){return '{ key:'+q(a.key)+', text:'+q(a.text)+' }';},'      '));
    F.push('    correctMap: { '+Object.keys(p.correctMap).map(function(k){return k+': '+q(p.correctMap[k]);}).join(', ')+' }');
  }else{
    F.push('    passage:'+q(p.passage));
    if(p.graphicData){
      F.push('    graphicData:['+p.graphicData.map(function(d){return '{year:'+q(d.year)+',val:'+d.val+'}';}).join(',')+']');
      F.push('    graphicCaption:'+q(p.graphicCaption));
    }
    if(p.graphicSvg)F.push('    graphicSvg:'+tl(p.graphicSvg));
    F.push('    sentences:'+lst(p.sentences,function(s){return '{text:'+q(s.text)+', wrong:'+s.wrong+'}';},'      '));
  }
  return '  { ...TEMPLATE['+(n-1)+'],\n'+F.join(',\n')+'\n  }';
}

function build(src){
  var P=parse(src),mt=P.mt,model=[];
  var id=mt.id;
  for(var n=1;n<=7;n++){
    var t=null;mt.teile.forEach(function(x){if(x.n===n)t=x;});
    if(!t)continue;
    model.push(Object.assign({},TEMPLATE[n-1],{instructions:t.anw||DEF[n-1],title:t.titel},BUILD[n-1](t)));
  }
  var code='',tline='';
  if(model.length===7&&id){
    code='const MT'+id+' = [\n'+model.map(function(p,i){return ser(p,i+1);}).join(',\n')+'\n];';
    tline='{id:'+id+', title:'+q(mt.title)+', teile: MT'+id+'}';
  }
  return {code:code, tline:tline};
}

var $=function(i){return document.getElementById(i);};$('fileInput').onchange=function(e){
  var files=e.target.files;
  if(!files.length)return;
  var content="";
  var loaded=0;
  for(var i=0; i<files.length; i++){
    var reader=new FileReader();
    reader.onload=(function(fIndex){
      return function(evt){
        content+=evt.target.result+"\n\n";
        loaded++;
        if(loaded===files.length){
          $('in').value=content;
        }
      };
    })(i);
    reader.readAsText(files[i]);
  }
};

$('conv').onclick=function(){
  var r=build($('in').value);$('out1').value=r.code;
  $('out2').value=r.tline;
  if(r.code){
    $('sum').innerHTML='<div class="box ok">✓ Conversion réussie !</div>';
  } else {
    $('sum').innerHTML='<div class="box error">✖ Erreur de conversion, vérifiez le contenu.</div>';
  }
};
$('c1').onclick=function(){$('out1').select();try{document.execCommand('copy');}catch(e){}};
$('c2').onclick=function(){$('out2').select();try{document.execCommand('copy');}catch(e){}};
</script></body></html>
