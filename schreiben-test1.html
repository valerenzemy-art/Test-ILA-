<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelltest 1 - Schreiben</title>
    <style>
        :root {
            --primary: #6366f1;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-hover-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: rgba(255, 255, 255, 0.4);
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            /* Fond avec la même image de profondeur et un voile sombre */
            background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.75)), url('fond-flyer.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container { 
            max-width: 650px; 
            width: 100%; 
            text-align: center; 
        }

        h1 { 
            font-size: 2rem; 
            color: #ffffff; 
            margin-bottom: 8px; 
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        p.subtitle { 
            font-size: 0.95rem; 
            color: #cbd5e1; 
            margin-bottom: 35px; 
            line-height: 1.5;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .test-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 22px 24px;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            margin-bottom: 16px;
            text-align: left;
            border: 1px solid var(--border);
            border-left: 5px solid #818cf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .test-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover-bg);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.4), 0 10px 12px -6px rgba(0, 0, 0, 0.4);
            border-left-color: #6366f1;
        }

        .test-info h2 { 
            font-size: 1.1rem; 
            color: var(--text-main); 
            margin: 0 0 6px 0; 
            font-weight: 600;
        }

        .test-info p { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin: 0; 
            line-height: 1.4;
        }

        .start-btn {
            background-color: #4f46e5;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .test-card:hover .start-btn {
            background-color: #4338ca;
        }

        .back-link { 
            display: inline-block; 
            margin-top: 30px; 
            color: #cbd5e1; 
            text-decoration: none; 
            font-weight: 600;
            font-size: 0.9rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            transition: color 0.2s;
        }

        .back-link:hover { 
            color: #ffffff; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Modelltest 1</h1>
        <p class="subtitle">Wähle die Aufgabe aus, die du bearbeiten möchtest.</p>

        <!-- Aufgabe 1 -->
        <a href="aufgabe1.html" class="test-card">
            <div class="test-info">
                <h2>Aufgabe 1</h2>
                <p>Diskussion: Bildungsexpansion (Min. 200 Wörter, 30 Min.)</p>
            </div>
            <div class="start-btn">Starten</div>
        </a>

        <!-- Aufgabe 2 -->
        <a href="aufgabe2.html" class="test-card">
            <div class="test-info">
                <h2>Aufgabe 2</h2>
                <p>Zusammenfassung: Koffein & Energiedrinks (100–150 Wörter, 30 Min.)</p>
            </div>
            <div class="start-btn">Starten</div>
        </a>

        <a href="schreiben.html" class="back-link">&larr; Zurück zur Übersicht</a>
    </div>
</body>
</html>
