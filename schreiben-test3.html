<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestDaF C1 - Modelltest 3</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 600px; width: 100%; text-align: center; }
        h1 { font-size: 1.8rem; color: #2c3e50; margin-bottom: 10px; }
        p.subtitle { font-size: 1rem; color: #7f8c8d; margin-bottom: 30px; }
        .task-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            text-align: left;
            border-left: 6px solid #4f46e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .task-info h2 { font-size: 1.15rem; color: #2c3e50; margin: 0 0 6px 0; }
        .task-info p { font-size: 0.9rem; color: #555; margin: 0; }
        .btn-start {
            background: #4f46e5;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-start:hover { background: #4338ca; }
        .back-link { display: inline-block; margin-top: 20px; color: #2c3e50; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Modelltest 3</h1>
        <p class="subtitle">Wähle die Aufgabe aus, die du bearbeiten möchtest.</p>

        <div class="task-card">
            <div class="task-info">
                <h2>Aufgabe 1</h2>
                <p>Diskussion / Argumentation (Min. 200 Wörter, 30 Min.)</p>
            </div>
            <a href="schreiben-test3-aufgabe1.html" class="btn-start">Starten</a>
        </div>

        <div class="task-card">
            <div class="task-info">
                <h2>Aufgabe 2</h2>
                <p>Zusammenfassung mit Text & Grafik (100–150 Wörter, 30 Min.)</p>
            </div>
            <a href="schreiben-test3-aufgabe2.html" class="btn-start">Starten</a>
        </div>

        <a href="schreiben.html" class="back-link">← Zurück zur Übersicht</a>
    </div>
</body>
</html>
