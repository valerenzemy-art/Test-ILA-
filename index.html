<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesen — Akademischer Modelltest</title>
<style>
  :root{
    --teal-dark:#0f3d47;
    --teal:#155a68;
    --teal-light:#1d7285;
    --bg-page:#f4f8f9;
    --bg-instructions:#e7f1f3;
    --card-bg:#ffffff;
    --border:#cfe0e4;
    --text:#1e2d31;
    --text-soft:#516268;
    --red:#b3262c;
    --red-dark:#8c1e23;
    --red-text:#ffffff;
    --correct:#1c7a4a;
    --wrong:#b3262c;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg-page:#0e1416;
      --card-bg:#151d20;
      --border:#2b3a3f;
      --text:#eaf1f2;
      --text-soft:#9fb2b7;
      --bg-instructions:#132a2f;
    }
  }
  :root[data-theme="dark"]{
    --bg-page:#0e1416;
    --card-bg:#151d20;
    --border:#2b3a3f;
    --text:#eaf1f2;
    --text-soft:#9fb2b7;
    --bg-instructions:#132a2f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-page);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
  }
  .app{max-width:900px;margin:0 auto;min-height:100vh;background:var(--card-bg);box-shadow:0 0 24px rgba(0,0,0,.06);}
  header.topbar{
    background:linear-gradient(135deg,var(--teal-dark),var(--teal));
    color:#fff;
    padding:18px 20px 14px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  header.topbar .brand{font-size:1.5rem;font-weight:700;letter-spacing:.5px;}
  header.topbar .subbrand{font-size:.72rem;opacity:.75;margin-top:2px;}
  header.topbar .tag{font-size:.8rem;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:20px;white-space:nowrap;}

  .taskbar{
    background:var(--bg-instructions);
    border-bottom:1px solid var(--border);
    padding:16px 20px 18px;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    align-items:center;
  }
  .task-count{display:flex;align-items:baseline;gap:6px;min-width:70px;}
  .task-count .n{font-size:2.1rem;font-weight:800;color:var(--teal-dark);line-height:1;}
  .task-count .of{font-size:1rem;color:var(--text-soft);}
  .task-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);margin-bottom:2px;}

  .timer-wrap{display:flex;flex-direction:column;align-items:center;}
  .timer-circle{
    width:74px;height:74px;border-radius:50%;
    border:3px solid var(--teal);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:1.05rem;color:var(--teal-dark);
    background:var(--card-bg);
    flex-shrink:0;
  }
  .timer-circle.warn{border-color:var(--red);color:var(--red);}
  .timer-caption{font-size:.65rem;color:var(--text-soft);margin-top:4px;}

  .instructions{flex:1;min-width:220px;}
  .instructions .title{font-weight:700;margin-bottom:4px;font-size:1rem;}
  .instructions p{margin:2px 0;font-size:.92rem;color:var(--text-soft);}
  .instructions .time-hint{font-weight:600;color:var(--teal-dark);}

  main{padding:22px 20px 100px;}
  h2.task-title{margin-top:0;font-size:1.2rem;color:var(--teal-dark);}
  .passage{font-size:.98rem;}
  .passage p{margin:0 0 14px;}

  select.gapselect{
    border:none;border-bottom:2px solid var(--teal);
    background:var(--bg-instructions);
    font:inherit;font-weight:600;color:var(--teal-dark);
    padding:3px 6px;border-radius:4px 4px 0 0;
    min-width:130px;
  }
  select.gapselect.answered{background:#dff0e4;border-color:var(--correct);}

  .order-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .order-item{
    border:1px solid var(--border);border-radius:8px;padding:12px 14px;
    background:var(--bg-instructions);
    display:flex;gap:10px;align-items:flex-start;
  }
  .order-item .pos{
    font-weight:800;color:#fff;background:var(--teal);
    border-radius:50%;width:26px;height:26px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.85rem;
  }
  .order-item .txt{flex:1;font-size:.92rem;}
  .order-controls{display:flex;flex-direction:column;gap:4px;}
  .order-controls button{
    border:1px solid var(--border);background:var(--card-bg);color:var(--teal-dark);
    border-radius:5px;width:30px;height:26px;font-size:.85rem;cursor:pointer;
  }
  .order-controls button:disabled{opacity:.3;cursor:default;}

  .qblock{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .qblock:last-child{border-bottom:none;}
  .qtext{font-weight:600;margin-bottom:8px;}
  .opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.92rem;}
  .opt:hover{background:var(--bg-instructions);}
  .opt input{margin-top:3px;}

  .matchrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:10px;background:var(--bg-instructions);border-radius:8px;}
  .matchrow .ptxt{flex:1;min-width:200px;font-size:.9rem;}
  .matchrow select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--border);min-width:220px;}

  table.tzt{width:100%;border-collapse:collapse;margin-top:8px;font-size:.85rem;}
  table.tzt th, table.tzt td{border:1px solid var(--border);padding:8px 6px;text-align:center;}
  table.tzt th{background:var(--teal);color:#fff;font-weight:600;font-size:.8rem;}
  table.tzt td.label{text-align:left;font-weight:500;}
  table.tzt input[type=radio]{width:16px;height:16px;}

  .twocat-item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:var(--bg-instructions);}
  .twocat-item .lbl{flex:1;min-width:200px;font-size:.9rem;}
  .toggle-btns{display:flex;gap:6px;}
  .toggle-btns button{border:1px solid var(--teal);background:var(--card-bg);color:var(--teal-dark);padding:6px 12px;border-radius:20px;font-size:.82rem;cursor:pointer;}
  .toggle-btns button.active{background:var(--teal);color:#fff;}

  .graphic-box{background:var(--bg-instructions);border:1px solid var(--border);border-radius:10px;padding:14px;margin:16px 0;}
  .graphic-box .cap{font-size:.78rem;color:var(--text-soft);margin-top:6px;text-align:center;}

  .summary-item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;font-size:.9rem;}
  .summary-item:hover{background:var(--bg-instructions);}
  .summary-item input{margin-top:4px;}
  .count-hint{font-size:.82rem;color:var(--text-soft);margin:10px 0;}

  footer.navbar{
    position:sticky;bottom:0;
    background:var(--card-bg);
    border-top:1px solid var(--border);
    padding:12px 20px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  footer .foot-note{font-size:.7rem;color:var(--text-soft);}
  .btn{
    border:none;border-radius:6px;padding:11px 18px;font-size:.88rem;font-weight:700;cursor:pointer;
    color:var(--red-text);background:var(--red-dark);
  }
  .btn.next{background:var(--red);}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--teal-dark);border:1px solid var(--teal);}

  .results h2{color:var(--teal-dark);}
  .score-hero{
    background:linear-gradient(135deg,var(--teal-dark),var(--teal));
    color:#fff;border-radius:12px;padding:24px;text-align:center;margin-bottom:22px;
  }
  .score-hero .pct{font-size:2.6rem;font-weight:800;}
  .score-hero .tdn{font-size:1rem;opacity:.9;margin-top:4px;}
  .result-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:.92rem;}
  .result-row .ok{color:var(--correct);font-weight:700;}
  .result-row .no{color:var(--wrong);font-weight:700;}
  .keylist{font-size:.82rem;color:var(--text-soft);margin-top:4px;}

  @media (max-width:480px){
    header.topbar{padding:14px 14px 12px;}
    .taskbar{padding:14px 14px;gap:12px;}
    main{padding:18px 14px 90px;}
    footer.navbar{padding:10px 14px;}
    .timer-circle{width:62px;height:62px;font-size:.92rem;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div>

  <div class="taskbar" id="taskbar"></div>

  <main id="main"></main>

</div>

  title:'Grüne Infrastruktur gegen urbane Hitzeinseln',
  passage:[
    "(1) In vielen Großstädten liegen die Temperaturen an heißen Sommertagen mehrere Grad über denen des Umlands – ein Phänomen, das als urbane Hitzeinsel bezeichnet wird. Besonders in den Abend- und Nachtstunden kühlen dicht bebaute Innenstädte kaum ab, da gespeicherte Wärme aus Asphalt, Beton und Fassaden nur langsam wieder abgegeben wird. Für die Bewohnerinnen und Bewohner bedeutet dies nicht nur eine Beeinträchtigung der Lebensqualität, sondern auch ein gesundheitliches Risiko, da anhaltende nächtliche Hitze die Erholung des Körpers erschwert und insbesondere für ältere Menschen und Personen mit Vorerkrankungen gefährlich werden kann. Angesichts des fortschreitenden Klimawandels gewinnt die Frage, wie sich Städte kühler gestalten lassen, zunehmend an Bedeutung für die Stadtplanung.",

    "(5) Der Umsetzung stehen jedoch praktische Hürden entgegen. Die Anlage und Pflege von Grünflächen verursacht Kosten, die in kommunalen Haushalten oft mit anderen Investitionen konkurrieren, und die Bewässerung neu gepflanzter Bäume wird gerade in trockenen Sommern zu einer zusätzlichen Belastung. Zudem konkurriert Begrünung in wachsenden Städten häufig mit anderen Nutzungsansprüchen an knappen Flächen, etwa für Wohnraum, Verkehrswege oder Leitungstrassen. Auch technische Fragen, etwa die statische Tragfähigkeit älterer Gebäude für Dachbegrünungen, müssen im Einzelfall gelöst werden. Fachleute betonen daher, dass Begrünungsmaßnahmen von Beginn an in die Stadtplanung integriert werden sollten, anstatt sie nachträglich und isoliert umzusetzen.",

/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
let current = 0;
let timerInterval = null;
let remaining = 0;
const answers = {}; // per task id

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */
function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+":"+s;
}

function clearTimer(){ if(timerInterval) clearInterval(timerInterval); }

function startTimer(seconds){
  clearTimer();
  remaining = seconds;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      remaining = 0;
      updateTimerDisplay();
      clearTimer();
    } else {
      updateTimerDisplay();
    }
  },1000);
}

function updateTimerDisplay(){
  const el = document.getElementById('timerText');
  const circle = document.getElementById('timerCircle');
  if(!el) return;
  el.textContent = fmt(remaining);
  if(remaining <= 30){ circle.classList.add('warn'); } else { circle.classList.remove('warn'); }
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------------------------------------------------------
   RENDER: TASKBAR
--------------------------------------------------------- */
function renderTaskbar(task){
  const tb = document.getElementById('taskbar');
  tb.innerHTML = `
    <div class="task-count">
      <div>
        <div class="task-label">Aufgabe</div>
        <span class="n">${task.id}</span><span class="of">/7</span>
      </div>
    </div>
    <div class="timer-wrap">
      <div class="timer-circle" id="timerCircle"><span id="timerText">--:--</span></div>
      <div class="timer-caption">verbleibend</div>
    </div>
    <div class="instructions">
      <div class="title">${task.label}</div>
      <p>${task.instructions}</p>
      <p class="time-hint">Sie haben ${fmt(task.time)} Minuten Zeit.</p>
    </div>
  `;
}

/* ---------------------------------------------------------
   RENDER: NAVBAR
--------------------------------------------------------- */
function renderNavbar(isLast){
  const nb = document.getElementById('navbar');
  nb.innerHTML = `
    <button class="btn" id="btnEnd">Beenden</button>
    <span class="foot-note">Eigener Übungstest · nicht die offizielle TestDaF-Prüfung</span>
    <button class="btn next" id="btnNext">${isLast ? 'Ergebnisse' : 'Aufgabe '+(current+2)+' →'}</button>
  `;
  document.getElementById('btnEnd').onclick = ()=>{
    if(confirm('Test wirklich beenden und Ergebnisse anzeigen?')) showResults();
  };
  document.getElementById('btnNext').onclick = ()=>{
    if(isLast){ showResults(); } else { current++; renderTask(); }
  };
}

/* ---------------------------------------------------------
   RENDER: TASK DISPATCH
--------------------------------------------------------- */
function renderTask(){
  const task = TASKS[current];
  renderTaskbar(task);
  startTimer(task.time);
  const main = document.getElementById('main');
  main.innerHTML = `<h2 class="task-title">${task.title}</h2><div id="taskBody"></div>`;
  const body = document.getElementById('taskBody');

  if(!answers[task.id]) answers[task.id] = {};

  switch(task.type){
    case 'gap': renderGap(task, body); break;
    case 'order': renderOrder(task, body); break;
    case 'mc': renderMC(task, body); break;
    case 'match': renderMatch(task, body); break;
    case 'table': renderTable(task, body); break;
    case 'twocat': renderTwoCat(task, body); break;
    case 'summary': renderSummary(task, body); break;
  }
  renderNavbar(current === TASKS.length-1);
  window.scrollTo({top:0, behavior:'instant'});
}

/* ---- Aufgabe 1: Lückentext ---- */
function renderGap(task, body){
  let html = '<div class="passage"><p>';
  task.segments.forEach((seg, i)=>{
    html += escapeHtml(seg);
    if(i < task.gaps.length){
      const gap = task.gaps[i];
      html += `<select class="gapselect" data-idx="${i}"><option value="">(${i+1}) wählen …</option>`;
      gap.options.forEach((opt, oi)=>{
        html += `<option value="${oi}">${String.fromCharCode(97+oi)}) ${escapeHtml(opt)}</option>`;
      });
      html += `</select>`;
    }
  });
  html += '</p></div>';
  body.innerHTML = html;
  body.querySelectorAll('.gapselect').forEach(sel=>{
    const idx = sel.dataset.idx;
    if(answers[task.id][idx] !== undefined){ sel.value = answers[task.id][idx]; sel.classList.add('answered'); }
    sel.addEventListener('change', ()=>{
      answers[task.id][idx] = sel.value;
      sel.classList.toggle('answered', sel.value !== '');
    });
  });
}

/* ---- Aufgabe 2: Reihenfolge ---- */
function renderOrder(task, body){
  if(!answers[task.id].order) answers[task.id].order = [...task.shuffledStart];
  const order = answers[task.id].order;
  function draw(){
    let html = '<ul class="order-list">';
    order.forEach((origIdx, pos)=>{
      html += `<li class="order-item">
        <div class="pos">${pos+1}</div>
        <div class="txt">${escapeHtml(task.items[origIdx])}</div>
        <div class="order-controls">
          <button data-dir="up" data-pos="${pos}" ${pos===0?'disabled':''}>▲</button>
          <button data-dir="down" data-pos="${pos}" ${pos===order.length-1?'disabled':''}>▼</button>
        </div>
      </li>`;
    });
    html += '</ul>';
    body.innerHTML = html;
    body.querySelectorAll('button[data-dir]').forEach(btn=>{
      btn.onclick = ()=>{
        const pos = parseInt(btn.dataset.pos);
        const dir = btn.dataset.dir;
        const swapWith = dir === 'up' ? pos-1 : pos+1;
        [order[pos], order[swapWith]] = [order[swapWith], order[pos]];
        draw();
      };
    });
  }
  draw();
}

/* ---- Aufgabe 3: Fragen zum Text (MC) ---- */
function renderMC(task, body){
  let html = '<div class="passage">';
  task.passage.forEach(p=> html += `<p>${escapeHtml(p)}</p>`);
  html += '</div><div style="margin-top:20px;">';
  task.questions.forEach((q, qi)=>{
    html += `<div class="qblock"><div class="qtext">${qi+1}. ${escapeHtml(q.q)}</div>`;
    q.options.forEach((opt, oi)=>{
      const checked = answers[task.id][qi] == oi ? 'checked' : '';
      html += `<label class="opt"><input type="radio" name="q${qi}" value="${oi}" ${checked}> ${String.fromCharCode(97+oi)}) ${escapeHtml(opt)}</label>`;
    });
    html += `</div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  task.questions.forEach((q, qi)=>{
    body.querySelectorAll(`input[name="q${qi}"]`).forEach(inp=>{
      inp.addEventListener('change', ()=> answers[task.id][qi] = inp.value);
    });
  });
}

/* ---- Aufgabe 4: Sprachhandlungen zuordnen ---- */
function renderMatch(task, body){
  let html = '<div class="passage">';
  task.paragraphs.forEach((p, pi)=>{
    html += `<div class="matchrow">
      <div class="ptxt"><strong>Absatz ${pi+1}:</strong> ${escapeHtml(p)}</div>
      <select data-pi="${pi}">
        <option value="">Sprachhandlung wählen …</option>
        ${task.options.map((o,oi)=>`<option value="${oi}">${String.fromCharCode(65+oi)})${escapeHtml(o)}</option>`).join('')}
      </select>
    </div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  body.querySelectorAll('select[data-pi]').forEach(sel=>{
    const pi = sel.dataset.pi;
    if(answers[task.id][pi] !== undefined) sel.value = answers[task.id][pi];
    sel.addEventListener('change', ()=> answers[task.id][pi] = sel.value);
  });
}

/* ---- Aufgabe 5: Tabelle ---- */
function renderTable(task, body){
  let html = `<div class="passage"><p>${escapeHtml(task.passage)}</p></div>`;
  html += `<table class="tzt"><thead><tr><th style="text-align:left;">Aussage</th>${task.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  task.items.forEach((item, ii)=>{
    html += `<tr><td class="label">${ii+1}. ${escapeHtml(item.text)}</td>`;
    task.columns.forEach((c, ci)=>{
      const checked = answers[task.id][ii] == ci ? 'checked' : '';
      html += `<td><input type="radio" name="tbl${ii}" value="${ci}" ${checked}></td>`;
    });
    html += `</tr>`;
  });
  html += '</tbody></table>';
  body.innerHTML = html;
  task.items.forEach((item, ii)=>{
    body.querySelectorAll(`input[name="tbl${ii}"]`).forEach(inp=>{
      inp.addEventListener('change', ()=> answers[task.id][ii] = inp.value);
    });
  });
}

/* ---- Aufgabe 6: Problem/Lösung (zwei Kategorien) ---- */
function renderTwoCat(task, body){
  let html = `<div class="passage"><p>${escapeHtml(task.passage)}</p></div><div style="margin-top:16px;">`;
  task.items.forEach((item, ii)=>{
    html += `<div class="twocat-item" data-ii="${ii}">
      <div class="lbl">${ii+1}. ${escapeHtml(item.text)}</div>
      <div class="toggle-btns">
        ${task.categories.map((c,ci)=>`<button data-ci="${ci}" class="${answers[task.id][ii]==ci?'active':''}">${c}</button>`).join('')}
      </div>
    </div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  body.querySelectorAll('.twocat-item').forEach(row=>{
    const ii = row.dataset.ii;
    row.querySelectorAll('button[data-ci]').forEach(btn=>{
      btn.onclick = ()=>{
        answers[task.id][ii] = btn.dataset.ci;
        row.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
    });
  });
}

/* ---- Aufgabe 7: Zusammenfassung mit Fehlern (+ Grafik) ---- */
function renderSummary(task, body){
  const maxVal = Math.max(...task.graphicData.map(d=>d.val));
  let bars = '';
  task.graphicData.forEach(d=>{
    const h = Math.round((d.val/maxVal)*90)+10;
    bars += `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;">
      <div style="font-size:.68rem;color:var(--text-soft);">${d.val}k</div>
      <div style="width:70%;height:${h}px;background:var(--teal);border-radius:4px 4px 0 0;"></div>
      <div style="font-size:.7rem;color:var(--text-soft);">${d.year}</div>
    </div>`;
  });
  let html = `<div class="passage"><p>${escapeHtml(task.passage)}</p></div>
  <div class="graphic-box">
    <div style="display:flex;align-items:flex-end;gap:6px;height:120px;">${bars}</div>
    <div class="cap">${escapeHtml(task.graphicCaption)}</div>
  </div>
  <h3 style="color:var(--teal-dark);font-size:1rem;">Zusammenfassung</h3>
  <div class="count-hint">Kreuzen Sie genau <strong>drei</strong> Sätze an, die inhaltlich falsche Informationen enthalten. Ausgewählt: <span id="cnt">0</span>/3</div>
  <div id="sentList">`;
  task.sentences.forEach((s, si)=>{
    const checked = answers[task.id][si] ? 'checked' : '';
    html += `<label class="summary-item"><input type="checkbox" data-si="${si}" ${checked}><span>${escapeHtml(s.text)}</span></label>`;
  });
  html += '</div>';
  body.innerHTML = html;

  function updateCount(){
    const n = task.sentences.filter((s,si)=>answers[task.id][si]).length;
    document.getElementById('cnt').textContent = n;
  }
  body.querySelectorAll('input[data-si]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const si = cb.dataset.si;
      answers[task.id][si] = cb.checked;
      updateCount();
    });
  });
  updateCount();
}

/* ---------------------------------------------------------
   AUSWERTUNG
--------------------------------------------------------- */
function scoreTask(task){
  const a = answers[task.id] || {};
  let correct = 0, total = 0;
  switch(task.type){
    case 'gap':
      total = task.gaps.length;
      task.gaps.forEach((g,i)=>{ if(parseInt(a[i]) === g.correct) correct++; });
      break;
    case 'order':
      total = task.correctOrder.length;
      const order = a.order || [];
      order.forEach((origIdx, pos)=>{ if(task.correctOrder[pos] === origIdx) correct++; });
      break;
    case 'mc':
      total = task.questions.length;
      task.questions.forEach((q,i)=>{ if(parseInt(a[i]) === q.correct) correct++; });
      break;
    case 'match':
      total = task.correct.length;
      task.correct.forEach((c,i)=>{ if(parseInt(a[i]) === c) correct++; });
      break;
    case 'table':
      total = task.items.length;
      task.items.forEach((item,i)=>{ if(parseInt(a[i]) === item.correct) correct++; });
      break;
    case 'twocat':
      total = task.items.length;
      task.items.forEach((item,i)=>{ if(parseInt(a[i]) === item.correct) correct++; });
      break;
    case 'summary':
      total = task.sentences.length;
      task.sentences.forEach((s,i)=>{ const marked = !!a[i]; if(marked === s.wrong) correct++; });
      break;
  }
  return {correct, total};
}

function showResults(){
  clearTimer();
  document.getElementById('taskbar').innerHTML = '';
  const nb = document.getElementById('navbar');
  nb.innerHTML = `<span></span><span class="foot-note">Eigener Übungstest · nicht die offizielle TestDaF-Prüfung</span><button class="btn ghost" id="btnRestart">Neu starten</button>`;
  document.getElementById('btnRestart').onclick = ()=>{ location.reload(); };

  let sumCorrect = 0, sumTotal = 0;
  let rows = '';
  TASKS.forEach(task=>{
    const {correct, total} = scoreTask(task);
    sumCorrect += correct; sumTotal += total;
    rows += `<div class="result-row"><span>Aufgabe ${task.id} — ${task.label}</span><span class="${correct===total?'ok':'no'}">${correct} / ${total}</span></div>`;
  });
  const pct = sumTotal ? Math.round((sumCorrect/sumTotal)*100) : 0;
  let tdn = 'unterhalb TDN 3';
  if(pct >= 88) tdn = 'TDN 5';
  else if(pct >= 67) tdn = 'TDN 4';
  else if(pct >= 44) tdn = 'TDN 3';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="results">
      <div class="score-hero">
        <div class="pct">${pct}%</div>
        <div>${sumCorrect} von ${sumTotal} Punkten</div>
        <div class="tdn">Näherungswert: ${tdn}</div>
      </div>
      <h2>Ergebnisse nach Aufgabe</h2>
      ${rows}
      <p class="keylist" style="margin-top:16px;">Bewertung (Näherung, ersetzt keine offizielle TestDaF-Bewertung): ≥ 88 % = TDN 5 · ≥ 67 % = TDN 4 · ≥ 44 % = TDN 3 · darunter = unterhalb TDN 3</p>
    </div>
  `;
}

/* ---------------------------------------------------------
   INIT

renderTask();
