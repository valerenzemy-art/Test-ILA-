<style>
  :root {
    --bg-dark: #0f172a;
    --bg-card: #1e293b;
    --bg-card-hover: #334155;
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
    --teal-primary: #0d9488;
    --teal-light: #14b8a6;
    --teal-dark: #0f766e;
    --accent-blue: #38bdf8;
    --correct-bg: #134e4a;
    --correct-border: #2dd4bf;
    --wrong-bg: #7f1d1d;
    --wrong-border: #f87171;
    --font-main: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-light);
    font-family: var(--font-main);
    line-height: 1.6;
    padding-bottom: 80px;
  }

  header {
    background: linear-gradient(135deg, var(--bg-card), var(--teal-dark));
    padding: 2rem 1rem;
    text-align: center;
    border-bottom: 2px solid var(--teal-primary);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  header h1 {
    font-size: 1.8rem;
    color: var(--text-light);
    margin-bottom: 0.5rem;
  }

  header p {
    color: var(--accent-blue);
    font-size: 1rem;
  }

  .container {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
  }

  /* TEST SELECTION */
  .grid-select {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
  }

  .card-select {
    background: var(--bg-card);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 1.5rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-select:hover {
    background: var(--bg-card-hover);
    border-color: var(--teal-light);
    transform: translateY(-3px);
  }

  .card-select h3 {
    color: var(--accent-blue);
    margin-bottom: 0.5rem;
  }

  .card-select p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }

  .btn-start {
    background: var(--teal-primary);
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-start;
  }

  /* TASK UI */
  .task-card {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
    border: 1px solid #334155;
  }

  .task-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #334155;
  }

  .task-title {
    color: var(--teal-light);
    font-size: 1.2rem;
    font-weight: 600;
  }

  .timer-box {
    background: #090d16;
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    color: #f59e0b;
    font-weight: bold;
    font-family: monospace;
    border: 1px solid #d97706;
  }

  .task-text {
    background: #0f172a;
    padding: 1.2rem;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    border-left: 4px solid var(--teal-primary);
    white-space: pre-line;
  }

  /* INTERACTIVE ELEMENTS */
  select, input[type="text"] {
    background: #0f172a;
    color: var(--text-light);
    border: 1px solid var(--teal-primary);
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    font-size: 0.95rem;
    margin: 0 0.2rem;
  }

  .mc-option {
    display: block;
    margin: 0.5rem 0;
    padding: 0.8rem;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    cursor: pointer;
  }

  .mc-option:hover {
    border-color: var(--teal-light);
  }

  .mc-option input {
    margin-right: 0.8rem;
  }

  .order-item {
    background: #0f172a;
    padding: 0.8rem;
    margin-bottom: 0.5rem;
    border: 1px solid #334155;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .order-item select {
    width: 70px;
  }

  .table-grid {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
  }

  .table-grid th, .table-grid td {
    border: 1px solid #334155;
    padding: 0.8rem;
    text-align: left;
  }

  .table-grid th {
    background: #0f172a;
    color: var(--accent-blue);
  }

  /* BOTTOM NAVIGATION BAR */
  .navbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #090d16;
    padding: 0.8rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #334155;
    box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
    z-index: 100;
  }

  .btn {
    background: #334155;
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .btn:hover { background: #475569; }

  .btn.next {
    background: var(--teal-primary);
  }

  .btn.next:hover {
    background: var(--teal-light);
  }

  .taskbar {
    display: flex;
    gap: 0.4rem;
  }

  .task-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #1e293b;
    border: 1px solid #475569;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .task-dot.active {
    border-color: var(--teal-light);
    background: var(--teal-dark);
  }

  /* RESULTS VIEW */
  .results {
    background: var(--bg-card);
    padding: 2rem;
    border-radius: 12px;
    border: 1px solid #334155;
  }

  .score-hero {
    text-align: center;
    padding: 2rem;
    background: #0f172a;
    border-radius: 8px;
    margin-bottom: 2rem;
    border: 2px solid var(--teal-primary);
  }

  .pct { font-size: 2.5rem; font-weight: bold; color: var(--accent-blue); }
  .tdn { font-size: 1.2rem; color: var(--teal-light); margin-top: 0.5rem; }

  .result-row {
    padding: 0.8rem;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
  }

  .ok { color: var(--teal-light); font-weight: bold; }
  .no { color: #f87171; font-weight: bold; }

  .summary-sentence {
    padding: 0.5rem;
    margin: 0.3rem 0;
    border-radius: 4px;
    background: #0f172a;
    cursor: pointer;
    border: 1px solid #334155;
  }

  .summary-sentence.checked {
    border-color: #f87171;
    background: #450a0a;
  }

  .corr-box {
    margin-top: 1.5rem;
    background: #0f172a;
    padding: 1rem;
    border-radius: 8px;
    border: 1px solid #334155;
  }

  .corr-item {
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #1e293b;
  }

  .corr-tag-ok { color: #2dd4bf; font-weight: bold; }
  .corr-tag-no { color: #f87171; font-weight: bold; }
</style>
</head>

// Configuration des temps spécifiques par Aufgabe (en secondes)
// Aufgabe 1: 4 min (240s)
// Aufgabe 2: 5 min (300s)
// Aufgabe 3: 15 min (900s)
// Aufgabe 4: 6 min (360s)

// Aufgabe 7: 7 min (420s)
const TASK_TIMES_SECONDS = [240, 300, 900, 360, 540, 420, 420];

let currentTestIdx = 0;
let current = 0;
let userAnswers = {};
let timerInterval = null;
let timeLeft = 0;

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function showTestSelect() {
  clearTimer();
  document.getElementById('navbar').style.display = 'none';
  let html = `
    <h2>TestDaF Modelltests auswählen</h2>
    <p style="color:var(--text-muted); margin-bottom:1.5rem;">Wählen Sie einen der vier verfügbaren Modelltests zur Vorbereitung aus:</p>
    <div class="grid-select">
  `;

  TESTS.forEach((t, i) => {
    html += `
      <div class="card-select" onclick="selectTest(${i})">
        <div>
          <h3>${escapeHtml(t.title)}</h3>
          <p>7 wissenschaftssprachliche Aufgaben mit individuellen Zeitlimits (B2 bis C1+ / TDN 5 Niveau)</p>
        </div>
        <button class="btn-start">Test starten</button>
      </div>
    `;
  });

  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

function selectTest(idx) {
  currentTestIdx = idx;
  current = 0;
  userAnswers = {};
  document.getElementById('navbar').style.display = 'flex';
  renderTask();
}

function startTimer() {
  clearTimer();
  // Attribution du temps spécifique selon l'Aufgabe active
  timeLeft = TASK_TIMES_SECONDS[current] || 300;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearTimer();
      alert(`Die Zeit für Aufgabe ${current + 1} ist abgelaufen!`);
      if (current < TESTS[currentTestIdx].teile.length - 1) {
        current++;
        renderTask();
      } else {
        showResults();
      }
    }
  }, 1000);
}

function clearTimer() {
  if (timerInterval) clearInterval(timerInterval);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (!el) return;
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  el.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function renderTask() {
  startTimer();
  const test = TESTS[currentTestIdx];
  const task = test.teile[current];
  
  // Render Taskbar Navigation
  let tbHtml = '';
  test.teile.forEach((_, i) => {
    tbHtml += `<div class="task-dot ${i === current ? 'active' : ''}" onclick="goToTask(${i})">${i+1}</div>`;
  });
  document.getElementById('taskbar').innerHTML = tbHtml;

  let bodyHtml = '';

  if (task.type === 'lückentext') {
    let t = escapeHtml(task.text);
    task.gaps.forEach(g => {
      const savedVal = (userAnswers[current] && userAnswers[current][g.id]) || '';
      let optsHtml = `<option value="">-- ? --</option>`;
      g.options.forEach(opt => {
        const sel = savedVal === opt ? 'selected' : '';
        optsHtml += `<option value="${escapeHtml(opt)}" ${sel}>${escapeHtml(opt)}</option>`;
      });
      const selectHtml = `<select onchange="saveGap(${g.id}, this.value)">${optsHtml}</select>`;
      t = t.replace(`&lt;${g.id}&gt;`, selectHtml);
    });
    bodyHtml = `<div class="task-text">${t}</div>`;
  }
  else if (task.type === 'order') {
    bodyHtml = `<div class="task-text">${escapeHtml(task.text)}</div><div>`;
    task.items.forEach(item => {
      const savedPos = (userAnswers[current] && userAnswers[current][item.id]) || '';
      let opts = `<option value="">-</option>`;
      for (let i = 1; i <= task.items.length; i++) {
        opts += `<option value="${i}" ${savedPos == i ? 'selected' : ''}>${i}</option>`;
      }
      bodyHtml += `
        <div class="order-item">
          <select onchange="saveOrder('${item.id}', this.value)">${opts}</select>
          <span><strong>${item.id}:</strong> ${escapeHtml(item.text)}</span>
        </div>`;
    });
    bodyHtml += `</div>`;
  }
  else if (task.type === 'mc') {
    bodyHtml = `<div class="task-text">${escapeHtml(task.text)}</div>`;
    task.questions.forEach((q, qIdx) => {
      bodyHtml += `<div style="margin-bottom:1.5rem;">
        <p style="font-weight:600; margin-bottom:0.5rem;">${qIdx+1}. ${escapeHtml(q.text)}</p>`;
      q.options.forEach((opt, oIdx) => {
        const checked = (userAnswers[current] && userAnswers[current][qIdx] === oIdx) ? 'checked' : '';
        bodyHtml += `
          <label class="mc-option">
            <input type="radio" name="mc_${qIdx}" value="${oIdx}" ${checked} onchange="saveMC(${qIdx}, ${oIdx})">
            ${escapeHtml(opt)}
          </label>`;
      });
      bodyHtml += `</div>`;
    });
  }
  else if (task.type === 'match') {
    bodyHtml = `<div class="task-text">${escapeHtml(task.text)}</div>`;
    bodyHtml += `<div style="background:#0f172a; padding:1rem; border-radius:8px; margin-bottom:1rem;">`;
    task.options.forEach(o => {
      bodyHtml += `<div><strong>${o.id}:</strong> ${escapeHtml(o.text)}</div>`;
    });
    bodyHtml += `</div>`;
    task.questions.forEach((q, qIdx) => {
      const savedVal = (userAnswers[current] && userAnswers[current][qIdx]) || '';
      let selectOpts = `<option value="">-- Choice --</option>`;
      task.options.forEach(o => {
        selectOpts += `<option value="${o.id}" ${savedVal === o.id ? 'selected' : ''}>${o.id}</option>`;
      });
      bodyHtml += `
        <div style="margin-bottom:0.8rem;">
          <select onchange="saveMatch(${qIdx}, this.value)">${selectOpts}</select>
          <span>${escapeHtml(q.text)}</span>
        </div>`;
    });
  }
  else if (task.type === 'twocat') {
    bodyHtml = `<div class="task-text">${escapeHtml(task.text)}</div>`;
    task.items.forEach((item, iIdx) => {
      const savedCat = userAnswers[current] && userAnswers[current][iIdx];
      bodyHtml += `
        <div style="margin-bottom:1rem; background:#0f172a; padding:0.8rem; border-radius:6px;">
          <p style="margin-bottom:0.4rem;">${escapeHtml(item.text)}</p>
          <label style="margin-right:1rem;"><input type="radio" name="cat_${iIdx}" value="1" ${savedCat === 1 ? 'checked' : ''} onchange="saveCat(${iIdx}, 1)"> ${escapeHtml(task.cat1)}</label>
          <label><input type="radio" name="cat_${iIdx}" value="2" ${savedCat === 2 ? 'checked' : ''} onchange="saveCat(${iIdx}, 2)"> ${escapeHtml(task.cat2)}</label>
        </div>`;
    });
  }
  else if (task.type === 'table') {
    bodyHtml = `<div class="task-text">${escapeHtml(task.text)}</div>
      <table class="table-grid">
        <thead>
          <tr>
            <th>Aussage</th>
            ${task.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>`;
    task.rows.forEach((r, rIdx) => {
      const savedCol = userAnswers[current] && userAnswers[current][rIdx];
      bodyHtml += `<tr>
        <td>${escapeHtml(r.text)}</td>
        ${task.headers.map((_, cIdx) => `
          <td style="text-align:center;">
            <input type="radio" name="tbl_${rIdx}" value="${cIdx}" ${savedCol === cIdx ? 'checked' : ''} onchange="saveTable(${rIdx},${cIdx})">
          </td>
        `).join('')}
      </tr>`;
    });
    bodyHtml += `</tbody></table>`;
  }
  else if (task.type === 'summary') {
    bodyHtml = `<div class="task-text">${escapeHtml(task.text)}</div>
      <p style="margin-bottom:0.8rem; color:var(--text-muted);">Klicken Sie auf Sätze, die fehlerhafte Informationen enthalten:</p>`;
    task.sentences.forEach((s, sIdx) => {
      const isChecked = userAnswers[current] && userAnswers[current][sIdx];
      bodyHtml += `
        <div class="summary-sentence ${isChecked ? 'checked' : ''}" id="sum_${sIdx}" onclick="toggleSummary(${sIdx})">
          ${sIdx + 1}. ${escapeHtml(s.text)}
        </div>`;
    });
  }

  document.getElementById('main').innerHTML = `
    <div class="task-card">
      <div class="task-header">
        <span class="task-title">Teil ${task.teil}: ${escapeHtml(task.title)}</span>
        <span class="timer-box" id="timer">--:--</span>
      </div>
      ${bodyHtml}
    </div>
  `;

  // Update Footer Buttons
  document.getElementById('btnPrev').onclick = () => { if(current > 0) { current--; renderTask(); } };
  document.getElementById('btnNext').innerText = current === test.teile.length - 1 ? 'Auswerten' : 'Weiter →';
  document.getElementById('btnNext').onclick = () => {
    if (current < test.teile.length - 1) {
      current++;
      renderTask();
    } else {
      showResults();
    }
  };
}

function goToTask(idx) {
  current = idx;
  renderTask();
}

/* state persistence functions */
function initAnswerObject() {
  if (!userAnswers[current]) userAnswers[current] = {};
}
function saveGap(id, val) { initAnswerObject(); userAnswers[current][id] = val; }
function saveOrder(id, val) { initAnswerObject(); userAnswers[current][id] = val; }
function saveMC(qIdx, oIdx) { initAnswerObject(); userAnswers[current][qIdx] = oIdx; }
function saveMatch(qIdx, val) { initAnswerObject(); userAnswers[current][qIdx] = val; }
function saveCat(iIdx, cat) { initAnswerObject(); userAnswers[current][iIdx] = cat; }
function saveTable(rIdx, cIdx) { initAnswerObject(); userAnswers[current][rIdx] = cIdx; }
function toggleSummary(sIdx) {
  initAnswerObject();
  userAnswers[current][sIdx] = !userAnswers[current][sIdx];
  const el = document.getElementById(`sum_${sIdx}`);
  if (el) el.classList.toggle('checked');
}

/* scoring and results */
function scoreTask(task, test) {
  const ans = userAnswers[test.teile.indexOf(task)] || {};
  let correct = 0, total = 0;

  if (task.type === 'lückentext') {
    total = task.gaps.length;
    task.gaps.forEach(g => { if (ans[g.id] === g.correct) correct++; });
  } else if (task.type === 'order') {
    total = task.items.length;
    let userOrder = task.items.map(it => ({ id: it.id, pos: parseInt(ans[it.id]) || 99 }));
    userOrder.sort((a, b) => a.pos - b.pos);
    let userSortedIds = userOrder.map(u => u.id);
    task.correctOrder.forEach((id, idx) => { if (userSortedIds[idx] === id) correct++; });
  } else if (task.type === 'mc') {
    total = task.questions.length;
    task.questions.forEach((q, i) => { if (ans[i] === q.correct) correct++; });
  } else if (task.type === 'match') {
    total = task.questions.length;
    task.questions.forEach((q, i) => { if (ans[i] === q.correct) correct++; });
  } else if (task.type === 'twocat') {
    total = task.items.length;
    task.items.forEach((it, i) => { if (ans[i] === it.cat) correct++; });
  } else if (task.type === 'table') {
    total = task.rows.length;
    task.rows.forEach((r, i) => { if (ans[i] === r.correctCol) correct++; });
  } else if (task.type === 'summary') {
    total = task.sentences.length;
    task.sentences.forEach((s, i) => {
      const uChecked = !!ans[i];
      if ((s.wrong && uChecked) || (!s.wrong && !uChecked)) correct++;
    });
  }

  return { correct, total };
}

function renderCorrections(test) {
  let html = `<h3 style="color:var(--accent-blue); margin-top:2rem; margin-bottom:1rem;">Detaillierte Auswertung & Korrektur</h3>`;

  test.teile.forEach((task, tIdx) => {
    const a = userAnswers[tIdx] || {};
    html += `<div class="corr-box">
      <h4 style="color:var(--teal-light); margin-bottom:0.5rem;">Teil ${task.teil}: ${escapeHtml(task.title)}</h4>`;

    if (task.type === 'lückentext') {
      task.gaps.forEach(g => {
        const uVal = a[g.id] || 'Keine Antwort';
        const isOk = uVal === g.correct;
        html += `<div class="corr-item">
          Lücke ${g.id}: <strong>${escapeHtml(uVal)}</strong> 
          <span class="${isOk ? 'corr-tag-ok' : 'corr-tag-no'}">${isOk ? '✓ Richtig' : '✗ Falsch'}</span> 
          ${!isOk ? `(Richtig: <strong>${escapeHtml(g.correct)}</strong>)` : ''}
        </div>`;
      });
    } 
    else if (task.type === 'order') {
      let userOrder = task.items.map(it => ({ id: it.id, pos: parseInt(a[it.id]) || 99 }));
      userOrder.sort((a, b) => a.pos - b.pos);
      let userSortedIds = userOrder.map(u => u.id).join(' - ');
      let correctSortedIds = task.correctOrder.join(' - ');
      const isOk = userSortedIds === correctSortedIds;

      html += `<div class="corr-item">
        Ihre Reihenfolge: <strong>${escapeHtml(userSortedIds)}</strong><br>
        Richtige Reihenfolge: <strong>${escapeHtml(correctSortedIds)}</strong><br>
        Status: <span class="${isOk ? 'corr-tag-ok' : 'corr-tag-no'}">${isOk ? '✓ Vollständig Richtig' : '✗ Fehlerhaft'}</span>
      </div>`;
    } 
    else if (task.type === 'mc') {
      task.questions.forEach((q, i) => {
        const uAns = a[i];
        const isOk = uAns === q.correct;
        html += `<div class="corr-item">
          <strong>Frage ${i+1}:</strong> ${escapeHtml(q.text)}<br>
          Ihre Wahl: <em>${uAns !== undefined ? escapeHtml(q.options[uAns]) : 'Keine Antwort'}</em> — 
          <span class="${isOk ? 'corr-tag-ok' : 'corr-tag-no'}">${isOk ? '✓ Richtig' : '✗ Falsch'}</span>
          ${!isOk ? `<br>Richtig: <strong>${escapeHtml(q.options[q.correct])}</strong>` : ''}
        </div>`;
      });
    } 
    else if (task.type === 'match') {
      task.questions.forEach((q, i) => {
        const uAns = a[i] || 'Keine Auswahl';
        const isOk = uAns === q.correct;
        html += `<div class="corr-item">
          <strong>Aussage ${i+1}:</strong> "${escapeHtml(q.text)}"<br>
          Ihre Zuordnung: <strong>${escapeHtml(uAns)}</strong> — 
          <span class="${isOk ? 'corr-tag-ok' : 'corr-tag-no'}">${isOk ? '✓ Richtig' : '✗ Falsch'}</span>
          ${!isOk ? ` (Richtig: <strong>${escapeHtml(q.correct)}</strong>)` : ''}
        </div>`;
      });
    } 
    else if (task.type === 'twocat') {
      task.items.forEach((it, i) => {
        const uCat = a[i];
        const isOk = uCat === it.cat;
        const uStr = uCat === 1 ? task.cat1 : (uCat === 2 ? task.cat2 : 'Keine Auswahl');
        const cStr = it.cat === 1 ? task.cat1 : task.cat2;
        html += `<div class="corr-item">
          <strong>Item ${i+1}:</strong> "${escapeHtml(it.text)}"<br>
          Ihre Wahl: <em>${escapeHtml(uStr)}</em> — 
          <span class="${isOk ? 'corr-tag-ok' : 'corr-tag-no'}">${isOk ? '✓ Richtig' : '✗ Falsch'}</span>
          ${!isOk ? `<br>Richtig: <strong>${escapeHtml(cStr)}</strong>` : ''}
        </div>`;
      });
    } 
    else if (task.type === 'table') {
      task.rows.forEach((r, i) => {
        const uCol = a[i];
        const isOk = uCol === r.correctCol;
        const uStr = uCol !== undefined ? task.headers[uCol] : 'Keine Auswahl';
        const cStr = task.headers[r.correctCol];
        html += `<div class="corr-item">
          <strong>Aussage ${i+1}:</strong> "${escapeHtml(r.text)}"<br>
          Ihre Wahl: <em>${escapeHtml(uStr)}</em> — 
          <span class="${isOk ? 'corr-tag-ok' : 'corr-tag-no'}">${isOk ? '✓ Richtig' : '✗ Falsch'}</span>
          ${!isOk ? `<br>Richtig: <strong>${escapeHtml(cStr)}</strong>` : ''}
        </div>`;
      });
    } 
    else if (task.type === 'summary') {
      task.sentences.forEach((s, i) => {
        const uChecked = !!a[i];
        const isOk = (s.wrong && uChecked) || (!s.wrong && !uChecked);
        html += `<div class="corr-item">
          <strong>Satz ${i+1}:</strong> "${escapeHtml(s.text)}"<br>
          Status: <span class="${isOk ? 'corr-tag-ok' : 'corr-tag-no'}">${uChecked ? 'Als falsch markiert' : 'Nicht markiert'}</span> 
          ${!isOk ? ` (Sollte ${s.wrong ? 'als falsch markiert werden' : 'unmarkiert bleiben'})` : ''}
        </div>`;
      });
    }

    html += `</div>`;
  });

  return html;
}

function showResults() {
  clearTimer();
  document.getElementById('taskbar').innerHTML = '';
  const test = TESTS[currentTestIdx];
  let totC = 0, totT = 0;
  let rowsHtml = '';
  
  test.teile.forEach(task => {
    const sc = scoreTask(task, test);
    totC += sc.correct;
    totT += sc.total;
    const ok = sc.correct === sc.total;
    rowsHtml += `<div class="result-row">
      <span>Aufgabe ${task.teil}: ${escapeHtml(task.title)}</span>
      <span class="${ok ? 'ok' : 'no'}">${sc.correct} / ${sc.total}</span>
    </div>`;
  });
  
  const pct = Math.round((totC / totT) * 100);
  let tdn = "Unter TDN 3";
  if(pct >= 80) tdn = "TDN 5 (Sehr gut)";
  else if(pct >= 65) tdn = "TDN 4 (Gut / B2-C1 Bestanden)";
  else if(pct >= 50) tdn = "TDN 3";

  const correctionsHtml = renderCorrections(test);

  document.getElementById('main').innerHTML = `
    <div class="results">
      <h2>Auswertung — ${escapeHtml(test.title)}</h2>
      <div class="score-hero">
        <div class="pct">${totC} / ${totT} Punkte (${pct}%)</div>
        <div class="tdn">Ergebnis: <strong>${tdn}</strong></div>
      </div>
      <h3 style="color:var(--teal-light);">Ergebnisse pro Aufgabe</h3>
      ${rowsHtml}
      ${correctionsHtml}
    </div>
  `;
  
  document.getElementById('navbar').innerHTML = `
    <button class="btn" id="btnReselect">Weiterer Modelltest</button>
    <button class="btn next" id="btnRestart">Diesen Test wiederholen</button>
  `;
  document.getElementById('btnReselect').onclick = () => showTestSelect();
  document.getElementById('btnRestart').onclick = () => { current = 0; renderTask(); };
  window.scrollTo({top:0, behavior:'instant'});
}

// App initialisieren
showTestSelect();
</script>
