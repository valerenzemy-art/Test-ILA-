!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TestDaF — Modelltests Leseverstehen</title>
<style>
  :root{
    --teal-dark:#0f3d47;
    --teal:#155a68;
    --teal-light:#1d7285;
    --bg-page:#f4f8f9;
    --bg-instructions:#e7f1f3;
    --card-bg:#ffffff;
    --border:#cfe0e4;
    --text:#1e2d31;
    --text-soft:#516268;
    --correct:#1c7a4a;
    --wrong:#b3262c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg-page:#0e1416; --card-bg:#151d20; --border:#2b3a3f;
      --text:#eaf1f2; --text-soft:#9fb2b7; --bg-instructions:#132a2f;
    }
  }
  :root[data-theme="dark"]{
    --bg-page:#0e1416; --card-bg:#151d20; --border:#2b3a3f;
    --text:#eaf1f2; --text-soft:#9fb2b7; --bg-instructions:#132a2f;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg-page); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
  }
  .app{max-width:900px;margin:0 auto;min-height:100vh;background:var(--card-bg);box-shadow:0 0 24px rgba(0,0,0,.06);}
  header.topbar{
    background:linear-gradient(135deg,var(--teal-dark),var(--teal));
    color:#fff; padding:18px 20px 14px;
    padding-top:calc(18px + env(safe-area-inset-top,0px));
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  header.topbar .brand{font-size:1.5rem;font-weight:700;letter-spacing:.5px;}
  header.topbar .subbrand{font-size:.72rem;opacity:.8;margin-top:2px;}
  header.topbar .tag{font-size:.8rem;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;white-space:nowrap;}

  .select-screen{padding:36px 20px 60px;text-align:center;}
  .select-screen h2{color:var(--teal-dark);margin-bottom:6px;}
  .select-screen p{color:var(--text-soft);font-size:.92rem;max-width:540px;margin:0 auto 26px;}
  .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .sel-card{
    width:230px; border:1px solid var(--border); border-radius:14px; padding:20px 16px;
    background:var(--bg-instructions); cursor:pointer; text-align:left;
  }
  .sel-card:hover{border-color:var(--teal);}
  .sel-card .sc-title{font-size:1.05rem;font-weight:700;color:var(--teal-dark);margin-bottom:6px;}
  .sel-card .sc-desc{font-size:.83rem;color:var(--text-soft);}
  .back-link{
    display:inline-block; margin-bottom:18px; font-size:.85rem; color:var(--teal-dark);
    text-decoration:none; border:1px solid var(--border); padding:6px 12px; border-radius:20px; cursor:pointer;
  }
  .back-link:hover{border-color:var(--teal);}
  .select-note{font-size:.78rem;color:var(--text-soft);max-width:540px;margin:22px auto 0;}

  .taskbar{
    background:var(--bg-instructions); border-bottom:1px solid var(--border);
    padding:16px 20px 18px; display:flex; gap:18px; flex-wrap:wrap; align-items:center;
  }
  .task-count{display:flex;align-items:baseline;gap:6px;min-width:70px;}
  .task-count .n{font-size:2.1rem;font-weight:800;color:var(--teal-dark);line-height:1;}
  .task-count .of{font-size:1rem;color:var(--text-soft);}
  .task-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);margin-bottom:2px;}

  .timer-wrap{display:flex;flex-direction:column;align-items:center;}
  .timer-circle{
    width:74px;height:74px;border-radius:50%; border:3px solid var(--teal);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:1.05rem;color:var(--teal-dark);
    background:var(--card-bg); flex-shrink:0;
  }
  .timer-circle.warn{border-color:var(--wrong);color:var(--wrong);}
  .timer-caption{font-size:.65rem;color:var(--text-soft);margin-top:4px;}

  .instructions{flex:1;min-width:220px;}
  .instructions .title{font-weight:700;margin-bottom:4px;font-size:1rem;}
  .instructions p{margin:2px 0;font-size:.92rem;color:var(--text-soft);}
  .instructions .time-hint{font-weight:600;color:var(--teal-dark);}

  main{padding:22px 20px 100px;}
  h2.task-title{margin-top:0;font-size:1.2rem;color:var(--teal-dark);}
  .passage{font-size:.98rem;}
  .passage p{margin:0 0 14px;}

  .qblock{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .qblock:last-child{border-bottom:none;}
  .qtext{font-weight:600;margin-bottom:8px;}
  .opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.92rem;}
  .opt:hover{background:var(--bg-instructions);}
  .opt input{margin-top:3px;}

  table.tzt{width:100%;border-collapse:collapse;margin-top:8px;font-size:.83rem;}
  table.tzt th, table.tzt td{border:1px solid var(--border);padding:8px 6px;text-align:center;}
  table.tzt th{background:var(--teal);color:#fff;font-weight:600;font-size:.76rem;}
  table.tzt td.label{text-align:left;font-weight:500;}
  table.tzt input[type=radio]{width:16px;height:16px;}

  footer.navbar{
    position:sticky;bottom:0; background:var(--card-bg); border-top:1px solid var(--border);
    padding:12px 20px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  footer .foot-note{font-size:.68rem;color:var(--text-soft);}
  .btn{
    border:none;border-radius:6px;padding:11px 18px;font-size:.88rem;font-weight:700;cursor:pointer;
    color:#fff;background:var(--teal-dark);
  }
  .btn.next{background:var(--teal);}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--teal-dark);border:1px solid var(--teal);}

  .results h2{color:var(--teal-dark);}
  .score-hero{
    background:linear-gradient(135deg,var(--teal-dark),var(--teal));
    color:#fff;border-radius:12px;padding:24px;text-align:center;margin-bottom:22px;
  }
  .score-hero .pct{font-size:2.6rem;font-weight:800;}
  .score-hero .tdn{font-size:1rem;opacity:.9;margin-top:4px;}
  .result-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:.92rem;}
  .result-row .ok{color:var(--correct);font-weight:700;}
  .result-row .no{color:var(--wrong);font-weight:700;}
  .keylist{font-size:.82rem;color:var(--text-soft);margin-top:4px;}

  @media (max-width:480px){
    header.topbar{padding:14px 14px 12px;padding-top:calc(14px + env(safe-area-inset-top,0px));}
    .taskbar{padding:14px 14px;gap:12px;}
    main{padding:18px 14px 90px;}
    footer.navbar{padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));}
    .timer-circle{width:62px;height:62px;font-size:.92rem;}
    .cards{flex-direction:column;align-items:center;}
    table.tzt{font-size:.72rem;}
  }
</style>
</head>

/* ===========================================================
   STATE
=========================================================== */
let currentTestIdx = 0;
let currentTeilIdx = 0;
let timerInterval = null;
let remaining = 0;
const answers = {}; // answers[testId][teilNr] = {}

/* ===========================================================
   HELPERS
=========================================================== */
function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+":"+s;
}
function clearTimer(){ if(timerInterval) clearInterval(timerInterval); }
function startTimer(seconds){
  clearTimer(); remaining = seconds; updateTimerDisplay();
  timerInterval = setInterval(()=>{
    remaining--;
    if(remaining <= 0){ remaining = 0; updateTimerDisplay(); clearTimer(); }
    else { updateTimerDisplay(); }
  },1000);
}
function updateTimerDisplay(){
  const el = document.getElementById('timerText');
  const circle = document.getElementById('timerCircle');
  if(!el) return;
  el.textContent = fmt(remaining);
  if(remaining <= 30){ circle.classList.add('warn'); } else { circle.classList.remove('warn'); }
}
function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function getAnswerBucket(test, teil){
  if(!answers[test.id]) answers[test.id] = {};
  if(!answers[test.id][teil.teil]) answers[test.id][teil.teil] = {};
  return answers[test.id][teil.teil];
}

/* ===========================================================
   MODELLTEST-AUSWAHL
=========================================================== */
function showTestSelect(){
  clearTimer();
  document.getElementById('taskbar').innerHTML = '';
  document.getElementById('navbar').innerHTML = '';

  let cards = '';
  TESTS.forEach((test, idx)=>{
    cards += `<div class="sel-card" data-idx="${idx}">
      <div class="sc-title">${test.title}</div>
      <div class="sc-desc">Teil 1 Globalverstehen · Teil 2 Detailverstehen · Teil 3 Selektives Verstehen (30 Items gesamt)</div>
    </div>`;
  });

  document.getElementById('main').innerHTML = `
    <div class="select-screen">
      <h2>Leseverstehen — Modelltest wählen</h2>
      <p>Struktur wie in der echten TestDaF-Prüfung: 3 Lesetexte mit insgesamt 30 Items. Wählen Sie einen Modelltest und bearbeiten Sie die drei Teile nacheinander.</p>
      <div class="cards">${cards}</div>
      <p class="select-note">Eigens erstelltes Übungsmaterial im TestDaF-Format, kein Original-TestDaF-Material. Alle Texte und Aufgaben wurden neu verfasst.</p>
    </div>
  `;
  document.querySelectorAll('.sel-card[data-idx]').forEach(card=>{
    card.onclick = ()=> startTest(parseInt(card.dataset.idx));
  });
}

function startTest(idx){
  currentTestIdx = idx;
  currentTeilIdx = 0;
  renderTeil();
}

/* ===========================================================
   TASKBAR / NAVBAR
=========================================================== */
function renderTaskbar(teil, test){
  const tb = document.getElementById('taskbar');
  tb.innerHTML = `
    <div class="task-count">
      <div>
        <div class="task-label">${test.title} · Teil</div>
        <span class="n">${teil.teil}</span><span class="of">/3</span>
      </div>
    </div>
    <div class="timer-wrap">
      <div class="timer-circle" id="timerCircle"><span id="timerText">--:--</span></div>
      <div class="timer-caption">verbleibend</div>
    </div>
    <div class="instructions">
      <div class="title">${teil.label}</div>
      <p>${teil.instructions}</p>
      <p class="time-hint">Sie haben ${fmt(teil.time)} Minuten Zeit.</p>
    </div>
  `;
}

function renderNavbar(isLast){
  const nb = document.getElementById('navbar');
  nb.innerHTML = `
    <button class="btn ghost" id="btnMenu">Modelltests</button>
    <span class="foot-note">Eigenes Übungsmaterial · kein Original-TestDaF-Test</span>
    <button class="btn next" id="btnNext">${isLast ? 'Ergebnisse' : 'Teil '+(currentTeilIdx+2)+' →'}</button>
  `;
  document.getElementById('btnMenu').onclick = ()=>{
    if(confirm('Zurück zur Modelltest-Auswahl? Ihre Antworten in diesem Test bleiben erhalten.')) showTestSelect();
  };
  document.getElementById('btnNext').onclick = ()=>{
    if(isLast){ showResults(); } else { currentTeilIdx++; renderTeil(); }
  };
}

/* ===========================================================
   RENDER: TEIL DISPATCH
=========================================================== */
function renderTeil(){
  const test = TESTS[currentTestIdx];
  const teil = test.teile[currentTeilIdx];
  renderTaskbar(teil, test);
  startTimer(teil.time);
  const main = document.getElementById('main');
  main.innerHTML = `<h2 class="task-title">${teil.title}</h2><div id="taskBody"></div>`;
  const body = document.getElementById('taskBody');

  switch(teil.type){
    case 'table': renderTable(teil, test, body); break;
    case 'mc': renderMC(teil, test, body); break;
  }
  renderNavbar(currentTeilIdx === test.teile.length-1);
  window.scrollTo({top:0, behavior:'instant'});
}

/* ---- Teil: Tabelle (Globalverstehen / Detailverstehen) ---- */
function renderTable(teil, test, body){
  let html = `<div class="passage"><p>${escapeHtml(teil.passage)}</p></div>`;
  html += `<table class="tzt"><thead><tr><th style="text-align:left;">Aussage</th>${teil.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  const a = getAnswerBucket(test, teil);
  teil.items.forEach((item, ii)=>{
    html += `<tr><td class="label">${ii+1}. ${escapeHtml(item.text)}</td>`;
    teil.columns.forEach((c, ci)=>{
      const checked = a[ii] == ci ? 'checked' : '';
      html += `<td><input type="radio" name="tbl${ii}" value="${ci}" ${checked}></td>`;
    });
    html += `</tr>`;
  });
  html += '</tbody></table>';
  body.innerHTML = html;
  teil.items.forEach((item, ii)=>{
    body.querySelectorAll(`input[name="tbl${ii}"]`).forEach(inp=>{
      inp.addEventListener('change', ()=> a[ii] = inp.value);
    });
  });
}

/* ---- Teil: Multiple Choice ---- */
function renderMC(teil, test, body){
  let html = '<div class="passage">';
  teil.passage.forEach(p=> html += `<p>${escapeHtml(p)}</p>`);
  html += '</div><div style="margin-top:20px;">';
  const a = getAnswerBucket(test, teil);
  teil.questions.forEach((q, qi)=>{
    html += `<div class="qblock"><div class="qtext">${qi+1}. ${escapeHtml(q.q)}</div>`;
    q.options.forEach((opt, oi)=>{
      const checked = a[qi] == oi ? 'checked' : '';
      html += `<label class="opt"><input type="radio" name="q${qi}" value="${oi}" ${checked}> ${String.fromCharCode(97+oi)}) ${escapeHtml(opt)}</label>`;
    });
    html += `</div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  teil.questions.forEach((q, qi)=>{
    body.querySelectorAll(`input[name="q${qi}"]`).forEach(inp=>{
      inp.addEventListener('change', ()=> a[qi] = inp.value);
    });
  });
}

/* ===========================================================
   AUSWERTUNG
=========================================================== */
function scoreTeil(teil, test){
  const a = getAnswerBucket(test, teil);
  let correct = 0, total = 0;
  switch(teil.type){
    case 'table':
      total = teil.items.length;
      teil.items.forEach((item,i)=>{ if(parseInt(a[i]) === item.correct) correct++; });
      break;
    case 'mc':
      total = teil.questions.length;
      teil.questions.forEach((q,i)=>{ if(parseInt(a[i]) === q.correct) correct++; });
      break;
  }
  return {correct, total};
}

function showResults(){
  clearTimer();
  document.getElementById('taskbar').innerHTML = '';
  const test = TESTS[currentTestIdx];
  const nb = document.getElementById('navbar');
  nb.innerHTML = `<button class="btn ghost" id="btnMenu2">Modelltests</button><span class="foot-note">Eigenes Übungsmaterial · kein Original-TestDaF-Test</span><button class="btn" id="btnRestart">Test neu starten</button>`;
  document.getElementById('btnRestart').onclick = ()=>{ answers[test.id] = {}; currentTeilIdx = 0; renderTeil(); };
  document.getElementById('btnMenu2').onclick = ()=> showTestSelect();

  let sumCorrect = 0, sumTotal = 0;
  let rows = '';
  test.teile.forEach(teil=>{
    const {correct, total} = scoreTeil(teil, test);
    sumCorrect += correct; sumTotal += total;
    rows += `<div class="result-row"><span>Teil ${teil.teil} — ${teil.label}</span><span class="${correct===total?'ok':'no'}">${correct} / ${total}</span></div>`;
  });
  const pct = sumTotal ? Math.round((sumCorrect/sumTotal)*100) : 0;
  let tdn = 'unterhalb TDN 3';
  if(pct >= 88) tdn = 'TDN 5';
  else if(pct >= 67) tdn = 'TDN 4';
  else if(pct >= 44) tdn = 'TDN 3';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="results">
      <div class="score-hero">
        <div class="pct">${pct}%</div>
        <div>${sumCorrect} von ${sumTotal} Punkten</div>
        <div class="tdn">Näherungswert: ${tdn}</div>
      </div>
      <h2>Ergebnisse — ${test.title}</h2>
      ${rows}
      <p class="keylist" style="margin-top:16px;">Näherung, ersetzt keine offizielle TestDaF-Bewertung: ≥ 88 % ≈ TDN 5 · ≥ 67 % ≈ TDN 4 · ≥ 44 % ≈ TDN 3 · darunter = unterhalb TDN 3.</p>
    </div>
  `;
}

/* ===========================================================
   INIT
=========================================================== */
showTestSelect();
</script>
