<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelltest 7 – Aufgabe 2 – TestDaF Schreiben</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--sub:#5b6675;--line:#e3e7eb;--navy:#2f3d52;--navy-d:#232e3f;--red:#e2574c;--yellow:#ffd54f;--yellow-d:#f3c02f;--green:#4fa07a;--green-d:#3d8a67;--shadow:0 2px 10px rgba(20,30,45,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:5;background:#fff;box-shadow:var(--shadow);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.02rem;color:var(--navy);white-space:nowrap}
.brand span{color:var(--red)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.ctl button{border:0;padding:8px 15px;border-radius:999px;cursor:pointer;font:inherit;font-weight:700;font-size:.85rem;background:var(--bg);color:var(--navy)}
.ctl button.primary{background:var(--navy);color:#fff}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.3rem;color:var(--navy);background:var(--bg);border-radius:10px;padding:4px 12px}
.timer.warn{color:#a86a00;background:#fff2cf}.timer.over{color:#fff;background:var(--red)}
.banner{background:var(--red);color:#fff;padding:9px 18px;text-align:center;font-weight:700;font-size:.92rem}
.hidden{display:none}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;padding:20px 22px 60px;max-width:1180px;margin:0 auto}
.panel.left{position:sticky;top:66px;max-height:calc(100vh - 90px);overflow-y:auto;padding-right:4px}
@media(max-width:900px){.split{grid-template-columns:1fr;padding:16px 14px 50px}.panel.left{position:static;max-height:none}}
.meta{background:linear-gradient(180deg,var(--yellow),var(--yellow-d));border-left:6px solid var(--red);border-radius:14px;padding:14px 18px;font-weight:800;font-size:1.02rem;color:#3a2e05;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
.card{background:var(--card);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
.task h2{display:inline-block;background:var(--red);color:#fff;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:6px 15px;border-radius:999px;margin:0 0 14px}
.task p{margin:8px 0;font-size:.98rem}
.task p strong{color:var(--navy-d)}
.source{background:var(--card);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow)}
.source h3{margin:0 0 16px;font-size:1.2rem;font-weight:800;text-align:center;color:var(--navy-d)}
.source p{margin:0 0 12px;font-size:.94rem;text-align:justify;hyphens:auto;color:#333}
figure{margin:18px 0 0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
figure figcaption{background:var(--navy);color:#fff;font-size:.72rem;font-weight:700;padding:8px 14px;text-align:center}
figure svg{display:block;background:#fff}
.status-card{background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.9rem;color:var(--navy-d);font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--red)}
.stat b{color:var(--green-d)}
.tools{margin-left:auto;display:flex;gap:8px}
.tools button{border:0;padding:9px 16px;border-radius:12px;cursor:pointer;font:inherit;font-weight:700;font-size:.85rem}
#copy{background:linear-gradient(160deg,#6cc79c,var(--green-d));color:#fff;box-shadow:0 3px 10px rgba(61,138,103,.35)}
#clear{background:var(--bg);color:var(--navy-d)}
.writecard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:6px}
textarea{display:block;width:100%;border:0;outline:0;resize:vertical;min-height:480px;padding:16px;border-radius:14px;font:1.02rem/1.7 "Segoe UI",Helvetica,Arial,sans-serif;color:#111;background:#fff}
textarea::placeholder{color:#9aa5b1}
textarea.locked{background-color:#f4f6f7;color:#444;cursor:not-allowed}
.goalrow{margin-top:8px;font-size:.85rem;color:var(--sub);text-align:right}
.ok{color:var(--green-d);font-weight:700}.no{color:var(--red);font-weight:700}
.tips{font-size:.85rem;color:var(--sub);margin-top:14px;background:var(--bg);border-radius:10px;padding:10px 14px}
.eval{margin-top:20px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
.eval h2{margin:0 0 6px;font-size:1.08rem;color:var(--navy-d)}
.eval h3{font-size:.98rem;margin:16px 0 8px}
.matchcard{background:#fff8e1;border-left:4px solid var(--yellow-d);border-radius:10px;padding:10px 14px;margin:10px 0}
.matchcard .mtitle{font-size:.75rem;font-weight:800;color:#a86a00;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.matchcard .mctx{font-family:ui-monospace,monospace;font-size:.86rem;background:#fff;border-radius:8px;padding:8px 10px;line-height:1.6}
.matchcard .mctx mark{background:var(--red);color:#fff;border-radius:4px;padding:0 3px}
.matchcard .msug{margin-top:6px;font-size:.85rem}
.matchcard .msug span{display:inline-block;background:#e6f5ee;color:var(--green-d);border-radius:8px;padding:2px 8px;margin-right:4px;font-weight:600}
.nomatches{color:var(--green-d);font-weight:700;padding:10px 0}
.checknote{font-size:.8rem;color:var(--sub);margin:8px 0}
.checkbtn{background:linear-gradient(160deg,#6cc79c,var(--green-d));color:#fff;border:0;padding:9px 18px;border-radius:12px;cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;box-shadow:0 3px 10px rgba(61,138,103,.35);display:inline-flex;align-items:center;gap:6px}
